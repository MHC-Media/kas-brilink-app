<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kas BRILink</title>
<meta name="theme-color" content="#00529C">
<script>document.documentElement.classList.toggle('dark',(localStorage.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark')</script>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif']},colors:{bri:'#00529C',oren:'#F37021'}}}}</script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js" onerror="this.onerror=null;var x=document.createElement('script');x.src='https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js';x.onload=function(){window.icons&&icons()};document.head.appendChild(x)"></script>
<style>
:root{color-scheme:light}.dark{color-scheme:dark}
body{min-height:100vh;background:radial-gradient(900px 400px at 85% -10%,rgba(14,165,233,.14),transparent),radial-gradient(700px 400px at -10% 110%,rgba(243,112,33,.10),transparent),#f1f5f9;transition:background .3s}
.dark body{background:radial-gradient(900px 400px at 85% -10%,rgba(14,165,233,.16),transparent),radial-gradient(700px 400px at -10% 110%,rgba(243,112,33,.09),transparent),#0b1220}
.glass{background:rgba(255,255,255,.8);backdrop-filter:blur(14px);border:1px solid rgba(148,163,184,.25);box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -14px rgba(15,23,42,.18)}
.dark .glass{background:rgba(30,41,59,.62);border-color:rgba(148,163,184,.16);box-shadow:0 12px 28px -14px rgba(0,0,0,.6)}
.inp{width:100%;border-radius:.75rem;border:1px solid #cbd5e1;padding:.6rem .8rem;background:rgba(255,255,255,.6);transition:.15s}.dark .inp{border-color:#475569;background:rgba(15,23,42,.5)}
.inp:focus{outline:none;border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.25)}.dark .inp option{background:#1e293b}
.btn{display:inline-flex;align-items:center;gap:.4rem;border-radius:.75rem;padding:.55rem 1rem;font-weight:700;background:linear-gradient(135deg,#00529C,#0a74d4);color:#fff;box-shadow:0 6px 16px -8px #00529C;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.4;pointer-events:none}
.btn2{background:#e2e8f0;color:#0f172a;box-shadow:none}.dark .btn2{background:#334155;color:#e2e8f0}
.icon-btn{width:2.25rem;height:2.25rem;border-radius:.75rem;display:grid;place-items:center;transition:.15s}.icon-btn:hover{background:rgba(148,163,184,.2)}
th{font-weight:600;padding:.75rem 0;white-space:nowrap}tbody td{padding:.7rem 0}tbody tr:hover{background:rgba(14,165,233,.07)}
.dark ::-webkit-calendar-picker-indicator{filter:invert(.8)}
@media print{aside,header,.noprint{display:none!important}}
</style>
</head>
<body class="text-slate-800 dark:text-slate-100 font-sans antialiased">

<!-- LOGIN -->
<section id="login" class="relative min-h-screen hidden items-center justify-center p-4 bg-gradient-to-br from-bri via-sky-700 to-slate-900"><button class="themeBtn icon-btn absolute top-4 right-4 text-white" onclick="toggleTheme()" aria-label="Ganti tema"></button>
  <div class="glass w-full max-w-sm rounded-3xl p-8 shadow-xl">
    <img src="assets/logo.png" alt="BRILink" class="h-12 mb-4" onerror="this.outerHTML=LOGO_SVG"><h1 class="text-2xl font-bold text-bri dark:text-white">Kas BRILink</h1>
    <p class="text-sm text-slate-500 mb-6">Masuk untuk mencatat transaksi hari ini.</p>
    <input id="lu" class="inp mb-3" placeholder="Username" autocomplete="username">
    <input id="lp" type="password" class="inp mb-4" placeholder="Password" autocomplete="current-password">
    <button class="btn w-full justify-center" onclick="doLogin()"><i data-lucide="log-in" class="w-4"></i>Masuk</button>
    <p class="text-center text-xs text-slate-500 mt-6">MHC Media • ©2026</p>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden min-h-screen">
  <aside id="side" class="fixed inset-y-0 left-0 z-30 w-60 -translate-x-full md:translate-x-0 transition-transform glass border-r border-slate-200 dark:border-slate-700 p-4 flex flex-col">
    <div class="flex items-center gap-2 text-xl font-bold text-bri dark:text-white mb-6 px-2"><span class="w-9 h-9 rounded-xl bg-bri text-white grid place-items-center"><i data-lucide="landmark" class="w-5"></i></span>Kas BRILink</div>
    <nav id="nav" class="space-y-1 flex-1"></nav>
    <button onclick="doLogout()" class="flex items-center gap-3 px-3 py-2 rounded-xl text-red-600 hover:bg-red-500/10"><i data-lucide="log-out"></i>Keluar</button>
  </aside>
  <div class="md:ml-60">
    <header class="sticky top-0 z-20 glass flex items-center gap-3 px-4 py-3 border-b border-slate-200 dark:border-slate-700">
      <button class="md:hidden" onclick="side.classList.toggle('-translate-x-full')"><i data-lucide="menu"></i></button>
      <h2 id="title" class="font-bold flex-1"></h2>
      <button id="who" onclick="pwForm()" title="Ubah password" class="text-sm text-slate-500 hover:text-bri flex items-center gap-1"></button>
      <button class="themeBtn icon-btn" onclick="toggleTheme()" aria-label="Ganti tema"></button>
    </header>
    <main id="view" class="p-4 max-w-6xl mx-auto"></main>
    <footer class="text-center text-xs text-slate-500 py-6 noprint">MHC Media • ©2026</footer>
  </div>
</div>

<div id="modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/50 p-4"><div id="mbody" class="bg-white dark:bg-slate-800 rounded-2xl p-6 w-full max-w-md max-h-[90vh] overflow-auto"></div></div>
<div id="toast" class="fixed bottom-4 right-4 z-50 space-y-2"></div>
<div id="spin" class="fixed top-0 inset-x-0 h-1 bg-oren hidden"></div>

<script>
/* ===== Konfigurasi: tempel URL Web App Apps Script di sini ===== */
const LOGO_SVG = '<svg viewBox="0 0 190 48" class="h-12 mb-4 text-bri dark:text-white" role="img" aria-label="BRILink"><rect y="2" width="44" height="44" rx="12" fill="#00529C"/><path d="M12 24h20M26 15l9 9-9 9" stroke="#F37021" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="35" font-family="Plus Jakarta Sans,sans-serif" font-weight="800" font-size="30" fill="currentColor">BRI</text><text x="106" y="35" font-family="Plus Jakarta Sans,sans-serif" font-weight="800" font-size="30" fill="#F37021">Link</text></svg>';
const API_URL = 'https://script.google.com/macros/s/AKfycbzhJwiVrDXYcRVxr7Q8vD3AkI3WpkO38mnkKrGxUB4vfFsE6b_8uJ_BWm5D9LTppQGtqQ/exec';

/* ===== services/api.js (retry + loading + token) ===== */
const S = { token: localStorage.token, user: JSON.parse(localStorage.user || 'null'), last: Date.now() };
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const today = () => new Date().toLocaleDateString('sv-SE');
function toast(m, ok = true) {
  const d = document.createElement('div');
  d.className = 'px-4 py-2 rounded-xl text-white shadow ' + (ok ? 'bg-emerald-600' : 'bg-red-600'); d.textContent = m;
  $('toast').append(d); setTimeout(() => d.remove(), 3500);
}
const READ = { getDashboard: 60, getTransactions: 30, getExpenses: 30, getReports: 30, getUsers: 30 }, CACHE = new Map();
async function api(action, payload = {}, tries = 3) {
  if (API_URL.startsWith('GANTI')) { toast('API_URL belum diisi di index.html', false); throw new Error('API_URL belum diisi'); }
  const ttl = READ[action], key = action + JSON.stringify(payload), hit = ttl && CACHE.get(key);
  if (hit && Date.now() - hit.t < ttl * 1000) return JSON.parse(hit.v);
  const d = await apiRaw(action, payload, tries);
  if (ttl && d !== undefined) CACHE.set(key, { t: Date.now(), v: JSON.stringify(d) }); else if (action !== 'logError') CACHE.clear();
  return d;
}
async function apiRaw(action, payload = {}, tries = 3) {
  $('spin').classList.remove('hidden');
  try {
    for (let i = 0; i < tries; i++) {
      try {
        const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, token: S.token, payload }) }); // text/plain: tanpa preflight CORS
        const j = await r.json();
        if (!j.success) { if (j.data && j.data.expired) return logoutLocal(); throw Object.assign(new Error(j.message), { app: true }); }
        S.last = Date.now(); return j.data;
      } catch (e) { if (e.app || i === tries - 1) throw e; await new Promise(r => setTimeout(r, 800 * (i + 1))); }
    }
  } catch (e) { toast(e.message || 'Gagal terhubung ke server', false); throw e; }
  finally { $('spin').classList.add('hidden'); }
}

/* ===== services/auth.js ===== */
let LOGGING = false;
async function doLogin() {
  if (LOGGING) return; if (!val('lu') || !val('lp')) return toast('Isi username dan password', false);
  LOGGING = true; try { await doLogin0(); } finally { LOGGING = false; $('lp').value = ''; }
}
async function doLogin0() {
  try {
    const d = await api('login', { username: $('lu').value, password: $('lp').value });
    S.token = localStorage.token = d.token; S.user = d.user; localStorage.user = JSON.stringify(d.user); boot();
  } catch (e) {}
}
function logoutLocal() { CACHE.clear(); localStorage.removeItem('token'); localStorage.removeItem('user'); S.token = null; location.hash = ''; location.reload(); }
async function doLogout() { try { await api('logout', { token: S.token }); } catch (e) {} logoutLocal(); }
setInterval(() => { if (S.token && Date.now() - S.last > 30 * 60000) { toast('Logout otomatis: tidak aktif', false); logoutLocal(); } }, 30000);

/* ===== components/modal.js ===== */
function openModal(html) { $('mbody').innerHTML = html; $('modal').classList.replace('hidden', 'flex'); icons(); }
function closeModal() { $('modal').classList.replace('flex', 'hidden'); }
const LIB = { chart: 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js', xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', atable: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js', barcode: 'https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js' }, LOADED = {};
const loadLib = k => LOADED[k] = LOADED[k] || new Promise((ok, no) => { const e = document.createElement('script'); e.src = LIB[k]; e.onload = ok; e.onerror = () => { delete LOADED[k]; no(new Error('Gagal memuat pustaka ' + k + ', periksa koneksi')); }; document.head.appendChild(e); });
const icons = () => { try { window.lucide && lucide.createIcons(); } catch (e) {} };

/* ===== components/sidebar.js ===== */
const PAGES = [
  ['dashboard', 'Dashboard', 'home'], ['transaksi', 'Transaksi', 'credit-card'], ['pengeluaran', 'Pengeluaran', 'wallet'],
  ['laporan', 'Laporan', 'file-text'], ['setting', 'Pengaturan', 'settings'], ['users', 'Pengguna', 'users', 'Admin']
];
const NAVC = { dashboard: 'bg-sky-500/15 text-sky-500', transaksi: 'bg-emerald-500/15 text-emerald-500', pengeluaran: 'bg-rose-500/15 text-rose-500', laporan: 'bg-violet-500/15 text-violet-500', users: 'bg-orange-500/15 text-orange-500', setting: 'bg-teal-500/15 text-teal-500' };
function nav() {
  const cur = location.hash.slice(1) || 'dashboard';
  $('nav').innerHTML = PAGES.filter(p => !p[3] || p[3] === S.user.role).map(p =>
    `<a href="#${p[0]}" onclick="side.classList.add('-translate-x-full')" class="flex items-center gap-3 px-2 py-2 rounded-xl transition ${cur === p[0] ? 'bg-bri text-white font-bold shadow-md' : 'hover:bg-slate-500/10'}"><span class="w-9 h-9 rounded-lg grid place-items-center ${cur === p[0] ? 'bg-white/20 text-white' : NAVC[p[0]]}"><i data-lucide="${p[2]}" class="w-5 h-5"></i></span>${p[1]}</a>`).join('');
}

/* ===== Router ===== */
const JENIS = ['Transfer', 'Tarik Tunai', 'Setor Tunai', 'BRIVA', 'Pembayaran Tagihan', 'Top Up E-Wallet', 'Pulsa', 'Token PLN', 'Cicilan', 'QRIS', 'Lainnya'];
const KAT = ['Listrik', 'Internet', 'Sewa', 'ATK', 'Operasional', 'Lainnya'];
const opt = a => a.map(x => `<option>${x}</option>`).join('');
async function route() {
  const p = location.hash.slice(1) || 'dashboard', pg = PAGES.find(x => x[0] === p) || PAGES[0];
  $('title').textContent = pg[1]; nav();
  try { await VIEWS[pg[0]](); } catch (e) { $('view').innerHTML = `<p class="text-red-600">${e.message}</p>`; }
  icons();
}
function boot() {
  const ok = !!S.token;
  $('login').classList.toggle('hidden', ok); $('login').classList.toggle('flex', !ok); $('app').classList.toggle('hidden', !ok);
  if (ok) { $('who').innerHTML = `<i data-lucide="key-round" class="w-4"></i>${escH(S.user.nama)} (${S.user.role})`; route(); } paintTheme();
}
addEventListener('hashchange', () => S.token && route());
window.onerror = (m) => { if (S.token) api('logError', { m }, 1).catch(() => {}); };

const isDark = () => document.documentElement.classList.contains('dark');
function paintTheme() {
  const sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', moon = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
  document.querySelectorAll('.themeBtn').forEach(b => { b.style.cursor = 'pointer'; b.title = isDark() ? 'Ganti ke tema terang' : 'Ganti ke tema gelap'; b.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${isDark() ? sun : moon}</svg>`; });
  icons();
}
function toggleTheme() { const d = document.documentElement.classList.toggle('dark'); localStorage.theme = d ? 'dark' : 'light'; paintTheme(); if (S.token) route(); }
const TONE = { sky: 'bg-sky-500/15 text-sky-500', emerald: 'bg-emerald-500/15 text-emerald-500', violet: 'bg-violet-500/15 text-violet-500', orange: 'bg-orange-500/15 text-orange-500', rose: 'bg-rose-500/15 text-rose-500' };
const ICON_TONE = { receipt: 'sky', 'trending-up': 'emerald', calendar: 'violet', users: 'orange', wallet: 'rose', banknote: 'sky', landmark: 'violet' };
const card = (l, v, i) => `<div class="glass rounded-2xl p-4 flex items-center gap-3"><div class="w-11 h-11 rounded-2xl grid place-items-center shrink-0 ${TONE[ICON_TONE[i] || 'sky']}"><i data-lucide="${i}" class="w-5 h-5"></i></div><div class="min-w-0"><div class="text-xs text-slate-500">${l}</div><div class="text-lg font-bold truncate">${v}</div></div></div>`;
let charts = [];
function chart(id, type, labels, data, label) {
  const dk = isDark(), txt = dk ? '#94a3b8' : '#64748b', grid = dk ? 'rgba(148,163,184,.12)' : 'rgba(100,116,139,.14)', ctx = $(id).getContext('2d');
  const pal = ['#38bdf8', '#F37021', '#818cf8', '#34d399', '#f472b6', '#facc15', '#fb7185', '#2dd4bf', '#a78bfa', '#94a3b8', '#a3e635'];
  const ds = { label, data };
  if (type === 'line') {
    const g = ctx.createLinearGradient(0, 0, 0, 260); g.addColorStop(0, 'rgba(56,189,248,.5)'); g.addColorStop(1, 'rgba(56,189,248,0)');
    Object.assign(ds, { fill: true, backgroundColor: g, borderColor: '#38bdf8', borderWidth: 3, tension: .4, pointRadius: 0, pointHoverRadius: 6, pointHoverBackgroundColor: '#fff', pointHoverBorderColor: '#38bdf8', pointHoverBorderWidth: 3 });
  } else if (type === 'bar') Object.assign(ds, { backgroundColor: '#F37021', borderRadius: 8, borderSkipped: false, maxBarThickness: 28 });
  else Object.assign(ds, { backgroundColor: pal, borderWidth: 0, spacing: 4, borderRadius: 8, hoverOffset: 8 });
  const o = { responsive: true, maintainAspectRatio: false, animation: { duration: 900, easing: 'easeOutQuart' }, interaction: { mode: 'index', intersect: false },
    plugins: { legend: { display: type === 'doughnut', position: 'bottom', labels: { color: txt, usePointStyle: true, boxWidth: 8, padding: 14, font: { family: 'Plus Jakarta Sans' } } },
      tooltip: { backgroundColor: dk ? '#0f172a' : '#fff', titleColor: dk ? '#f1f5f9' : '#0f172a', bodyColor: txt, borderColor: grid, borderWidth: 1, padding: 10, cornerRadius: 10, displayColors: type === 'doughnut', boxPadding: 4 } } };
  if (type === 'doughnut') o.cutout = '72%';
  else o.scales = { x: { grid: { display: false }, border: { display: false }, ticks: { color: txt } }, y: { beginAtZero: true, grid: { color: grid }, border: { display: false }, ticks: { color: txt, precision: 0 } } };
  charts.push(new Chart(ctx, { type, data: { labels, datasets: [ds] }, options: o }));
}

/* ===== Pages ===== */
const VIEWS = {
  async dashboard() {
    charts.forEach(c => c.destroy()); charts = [];
    const [d] = await Promise.all([api('getDashboard'), loadLib('chart')]);
    $('view').innerHTML = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${card('Transaksi hari ini', d.trxHari, 'receipt')}${card('Laba hari ini', rp(d.labaHari), 'trending-up')}
      ${card('Transaksi bulan ini', d.trxBulan, 'calendar')}${card('Laba bulan ini', rp(d.labaBulan), 'trending-up')}
      ${card('Pelanggan', d.pelanggan, 'users')}${card('Pengeluaran bulan ini', rp(d.pengeluaranBulan), 'wallet')}
      <div class="col-span-2 rounded-2xl p-5 text-white shadow-lg flex items-center justify-between" style="background:linear-gradient(135deg,#00529C,#0ea5e9 70%,#F37021 150%)"><div><div class="text-sm opacity-80">Saldo kas saat ini</div><div class="text-2xl font-bold">${rp(d.saldoKas)}</div></div><i data-lucide="landmark" class="w-10 h-10 opacity-70"></i></div></div>
      <div class="grid md:grid-cols-2 gap-3 mt-3">
      <div class="glass rounded-2xl p-5"><div class="flex items-center gap-2 mb-3 font-bold"><i data-lucide="activity" class="w-4 text-sky-500"></i>Transaksi harian bulan ini</div><div class="h-64"><canvas id="c1"></canvas></div></div>
      <div class="glass rounded-2xl p-5"><div class="flex items-center gap-2 mb-3 font-bold"><i data-lucide="pie-chart" class="w-4 text-orange-500"></i>Jenis transaksi</div><div class="relative h-64"><canvas id="c2"></canvas><div class="absolute inset-x-0 top-0 flex flex-col items-center justify-center pointer-events-none" style="height:78%"><b class="text-2xl">${Object.values(d.jenis).reduce((a, b) => a + b, 0)}</b><span class="text-xs text-slate-500">transaksi</span></div></div></div></div>`;
    const ks = Object.keys(d.harian).sort(), lh = d.labaHarian || {};
    $('view').insertAdjacentHTML('beforeend', `<div class="glass rounded-2xl p-5 mt-3"><div class="flex items-center gap-2 mb-3 font-bold"><i data-lucide="bar-chart-3" class="w-4 text-orange-500"></i>Laba harian bulan ini</div><div class="h-64"><canvas id="c3"></canvas></div></div>`);
    chart('c1', 'line', ks, ks.map(k => d.harian[k]), 'Transaksi');
    chart('c3', 'bar', ks, ks.map(k => lh[k] || 0), 'Laba');
    chart('c2', 'doughnut', Object.keys(d.jenis), Object.values(d.jenis), 'Jenis');
  },

  async transaksi(page = 1) {
    const f = this.f = this.f || { q: '', jenis: '', dari: '', sampai: '' };
    const d = await api('getTransactions', { ...f, page, size: 10 });
    $('view').innerHTML = `<div class="flex flex-wrap gap-2 mb-3 noprint">
      <input class="inp !w-40" placeholder="Cari..." value="${f.q}" onchange="VIEWS.f.q=this.value;VIEWS.transaksi()">
      <select class="inp !w-40" onchange="VIEWS.f.jenis=this.value;VIEWS.transaksi()"><option value="">Semua jenis</option>${opt(JENIS)}</select>
      <input type="date" class="inp !w-40" value="${f.dari}" onchange="VIEWS.f.dari=this.value;VIEWS.transaksi()">
      <input type="date" class="inp !w-40" value="${f.sampai}" onchange="VIEWS.f.sampai=this.value;VIEWS.transaksi()">
      <button class="btn ml-auto" onclick="trxForm()"><i data-lucide="plus" class="w-4"></i>Transaksi</button></div>
      <div class="glass rounded-2xl overflow-x-auto"><table class="w-full text-sm"><thead class="text-left text-slate-500"><tr><th class="p-3">Waktu</th><th>Jenis</th><th>Pelanggan</th><th>Nominal</th><th>Admin</th><th>Laba</th><th></th></tr></thead><tbody>
      ${d.items.map(t => `<tr class="border-t border-slate-200 dark:border-slate-700"><td class="p-3">${t.tanggal}<br><small>${t.waktu}</small></td><td>${t.jenis_transaksi}</td><td>${t.pelanggan}</td><td>${rp(t.nominal)}</td><td>${rp(t.biaya_admin)}</td><td>${rp(t.laba)}</td>
      <td class="whitespace-nowrap noprint"><button onclick='struk(${JSON.stringify(t)})'><i data-lucide="printer" class="w-4"></i></button> <button onclick='trxForm(${JSON.stringify(t)})'><i data-lucide="pencil" class="w-4"></i></button> ${S.user.role === 'Admin' ? `<button onclick="del('deleteTransaction','${t.id}')"><i data-lucide="trash-2" class="w-4 text-red-500"></i></button>` : ''}</td></tr>`).join('') || '<tr><td class="p-6 text-center text-slate-500" colspan="7">Belum ada transaksi. Klik "+ Transaksi" untuk mulai.</td></tr>'}
      </tbody></table></div>
      <div class="flex justify-between mt-3 noprint"><button class="btn btn2" ${page < 2 ? 'disabled' : ''} onclick="VIEWS.transaksi(${page - 1})"><i data-lucide="chevron-left" class="w-4"></i>Sebelumnya</button><span>Hal ${page} / ${Math.ceil(d.total / 10) || 1}</span><button class="btn btn2" ${page * 10 >= d.total ? 'disabled' : ''} onclick="VIEWS.transaksi(${page + 1})">Berikutnya<i data-lucide="chevron-right" class="w-4"></i></button></div>`;
  },

  async pengeluaran() {

/* ===== Printer thermal Bluetooth (ESC/POS via Web Bluetooth) ===== */
const SET = Object.assign({ toko: 'AGEN BRILINK', alamat: '', footer: 'Terima kasih', lebar: 32, auto: false }, JSON.parse(localStorage.setting || '{}'));
const BT = { dev: null, ch: null, chunk: 100 };
const BT_SVC = ['000018f0-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '0000fff0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2'];
const btOn = () => !!(BT.ch && BT.dev && BT.dev.gatt.connected);
function paintPrinter() { const e = $('btst'); if (e) e.innerHTML = btOn() ? `<span class="text-emerald-500 font-bold">Terhubung:</span> ${escH(BT.dev.name)}` : 'Belum terhubung' + (localStorage.btName ? ` (terakhir: ${escH(localStorage.btName)})` : ''); }
async function btConnect(pick) {
  if (!navigator.bluetooth) throw new Error('Browser tidak mendukung Bluetooth. Pakai Chrome/Edge (Android atau komputer).');
  if (!BT.dev || pick) {
    BT.dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BT_SVC });
    BT.dev.addEventListener('gattserverdisconnected', () => { BT.ch = null; paintPrinter(); toast('Printer terputus', false); });
  }
  BT.ch = null;
  const srv = await BT.dev.gatt.connect();
  for (const sv of await srv.getPrimaryServices()) {
    const w = (await sv.getCharacteristics()).find(c => c.properties.write || c.properties.writeWithoutResponse);
    if (w) { BT.ch = w; break; }
  }
  if (!BT.ch) throw new Error('Printer ini tidak dikenali (tidak ada jalur tulis data). Coba printer ESC/POS BLE lain.');
  localStorage.btName = BT.dev.name || 'Printer'; return BT.dev.name || 'Printer';
}
async function btSend(bytes) {
  if (!btOn()) await btConnect(false);
  for (let n = BT.chunk, i = 0; i < bytes.length;) {
    try { BT.ch.properties.writeWithoutResponse ? await BT.ch.writeValueWithoutResponse(bytes.slice(i, i + n)) : await BT.ch.writeValue(bytes.slice(i, i + n)); i += n; }
    catch (e) { if (n > 20) { n = BT.chunk = 20; continue; } throw e; }
    await new Promise(r => setTimeout(r, 20));
  }
}
const enc = x => Array.from(String(x ?? '').normalize('NFD').replace(/[^\x20-\x7E]/g, ''), c => c.charCodeAt(0));
function escpos(t) {
  const W = Number(SET.lebar) || 32, B = [], txt = x => B.push(...enc(x), 10), line = () => txt('-'.repeat(W));
  const row = (a, b) => { a = String(a); b = String(b); const l = a.slice(0, Math.max(1, W - b.length - 1)); txt(l + ' '.repeat(Math.max(1, W - l.length - b.length)) + b); };
  B.push(27, 64, 27, 97, 1, 27, 69, 1); txt(SET.toko); B.push(27, 69, 0); if (SET.alamat) txt(SET.alamat);
  B.push(27, 97, 0); line(); txt(t.tanggal + ' ' + t.waktu); txt('No: ' + t.id); row('Jenis', t.jenis_transaksi); row('Pelanggan', t.pelanggan);
  line(); row('Nominal', rp(t.nominal)); row('Biaya admin', rp(t.biaya_admin));
  B.push(27, 69, 1); row('TOTAL', rp(Number(t.nominal) + Number(t.biaya_admin))); B.push(27, 69, 0);
  line(); txt('Operator: ' + t.operator); B.push(27, 97, 1); txt(SET.footer); B.push(10, 10, 10, 29, 86, 66, 0);
  return new Uint8Array(B);
}
async function struk(t) {
  if (navigator.bluetooth && (BT.dev || localStorage.btName)) {
    try { await btSend(escpos(t)); return toast('Struk dikirim ke printer'); }
    catch (e) { if (e.name === 'NotFoundError') return; toast('Printer gagal: ' + e.message + '. Memakai cetak browser.', false); }
  }
  const w = open('', '', 'width=320,height=480'); if (!w) return toast('Pop-up diblokir, izinkan pop-up untuk mencetak', false);
  w.document.write(`<pre style="font:12px monospace;width:58mm">${escH(SET.toko)}\n${escH(SET.alamat)}\n--------------------------------\n${t.tanggal} ${t.waktu}\nNo: ${t.id}\n${escH(t.jenis_transaksi)}\n${escH(t.pelanggan)}\nNominal : ${rp(t.nominal)}\nAdmin   : ${rp(t.biaya_admin)}\nTOTAL   : ${rp(Number(t.nominal) + Number(t.biaya_admin))}\n--------------------------------\n${escH(SET.footer)}</pre>`);
  w.document.close(); w.print();
}
async function btPair() { try { toast('Terhubung ke ' + await btConnect(true)); } catch (e) { if (e.name !== 'NotFoundError') toast(e.message, false); } paintPrinter(); }
async function btTest() { try { await btSend(escpos({ tanggal: today(), waktu: 'TES', id: 'TES', jenis_transaksi: 'Tes cetak', pelanggan: '-', nominal: 0, biaya_admin: 0, operator: S.user.username })); toast('Tes cetak dikirim'); } catch (e) { if (e.name !== 'NotFoundError') toast(e.message, false); } paintPrinter(); }
function btOff() { try { if (btOn()) BT.dev.gatt.disconnect(); } catch (e) {} BT.ch = null; localStorage.removeItem('btName'); paintPrinter(); toast('Printer diputuskan'); }
function saveSetting() { Object.assign(SET, { toko: val('s_toko'), alamat: val('s_alamat'), footer: val('s_footer'), lebar: Number(val('s_lebar')), auto: $('s_auto').checked }); localStorage.setting = JSON.stringify(SET); toast('Pengaturan disimpan'); }

const escH = x => String(x ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sumK = (a, k) => a.reduce((t, x) => t + Number(x[k] || 0), 0);

async function printReport() {

const sigCode = () => ('BRL-' + S.user.username + '-' + new Date().toISOString().slice(2, 16).replace(/\D/g, '')).toUpperCase();
const sigHtml = () => { const code = sigCode(); return `<div class="sig"><p>Dicetak ${new Date().toLocaleString('id-ID')}</p><p>Dibuat oleh,</p><img src="${barcodeURL(code)}" style="height:46px;max-width:100%"><div style="font-size:9pt;letter-spacing:1px">${escH(code)}</div><div style="border-top:1px solid #000;padding-top:4px;margin-top:6px"><b>${escH(S.user.nama)}</b><br>${S.user.role}</div></div>`; };
const rptRows = () => RPT.transaksi.map(t => [t.tanggal, t.waktu, t.jenis_transaksi, t.pelanggan, t.nominal, t.biaya_admin, t.laba]);
const HEAD = ['Tanggal', 'Waktu', 'Jenis', 'Pelanggan', 'Nominal', 'Biaya Admin', 'Laba'];
async function xlsxOut() { try { await loadLib('xlsx'); } catch (e) { return toast(e.message, false); } const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([HEAD, ...rptRows()]), 'Laporan'); XLSX.writeFile(wb, `laporan-${val('rd')}_${val('rs')}.xlsx`); }
async function pdfOut() {
  try { await Promise.all([loadLib('jspdf'), loadLib('barcode')]); await loadLib('atable'); } catch (e) { return toast(e.message, false); }
  const doc = new jspdf.jsPDF({ unit: 'mm', format: 'a4' }), M = { top: 30, left: 40, right: 30, bottom: 30 };
  doc.setFont('helvetica', 'normal'); doc.setFontSize(12);
  doc.text('Laporan Kas BRILink', M.left, M.top); doc.text(`Periode ${val('rd')} s/d ${val('rs')}`, M.left, M.top + 6);
  doc.autoTable({ startY: M.top + 12, margin: M, head: [['Tanggal', 'Jenis', 'Pelanggan', 'Nominal', 'Laba']], body: RPT.transaksi.map(t => [t.tanggal, t.jenis_transaksi, t.pelanggan, rp(t.nominal), rp(t.laba)]), styles: { font: 'helvetica', fontSize: 12, cellPadding: 1.5 }, headStyles: { fillColor: [0, 82, 156] } });
  const L = [`Total transaksi : ${RPT.totalTransaksi}`, `Total nominal : ${rp(RPT.totalNominal)}`, `Total laba : ${rp(RPT.totalLaba)}`, `Total pengeluaran : ${rp(RPT.totalPengeluaran)}`, `Saldo akhir : ${rp(RPT.saldoAkhir)}`];
  let y = doc.lastAutoTable.finalY + 8; if (y + L.length * 6 + 45 > 297 - M.bottom) { doc.addPage(); y = M.top; }
  L.forEach((l, i) => doc.text(l, M.left, y + i * 6));
  y += L.length * 6 + 6; const code = sigCode(), x = 210 - M.right - 60;
  doc.text('Dibuat oleh,', x + 30, y, { align: 'center' }); doc.addImage(barcodeURL(code), 'PNG', x, y + 3, 60, 14);
  doc.setFontSize(9); doc.text(code, x + 30, y + 21, { align: 'center' }); doc.setFontSize(12);
  doc.text(`${S.user.nama} (${S.user.role})`, x + 30, y + 28, { align: 'center' });
  doc.save(`laporan-${val('rd')}_${val('rs')}.pdf`);
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
['lu', 'lp'].forEach(i => $(i).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));
addEventListener('offline', () => toast('Tidak ada koneksi internet', false)); addEventListener('online', () => toast('Koneksi kembali'));
boot();
</script>
