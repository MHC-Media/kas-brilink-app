<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kas BRILink</title>
    <meta name="theme-color" content="#00529C">
    <script>
        document.documentElement.classList.toggle('dark', (localStorage.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark')
    </script>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    },
                    colors: {
                        bri: '#00529C',
                        oren: '#F37021'
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js" onerror="this.onerror=null;var x=document.createElement('script');x.src='https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js';x.onload=function(){window.icons&&icons()};document.head.appendChild(x)"></script>
    <style>
        :root {
            color-scheme: light
        }

        .dark {
            color-scheme: dark
        }

        body {
            min-height: 100vh;
            background: radial-gradient(900px 400px at 85% -10%, rgba(14, 165, 233, .14), transparent), radial-gradient(700px 400px at -10% 110%, rgba(243, 112, 33, .10), transparent), #f1f5f9;
            transition: background .3s
        }

        .dark body {
            background: radial-gradient(900px 400px at 85% -10%, rgba(14, 165, 233, .16), transparent), radial-gradient(700px 400px at -10% 110%, rgba(243, 112, 33, .09), transparent), #0b1220
        }

        .glass {
            background: rgba(255, 255, 255, .8);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(148, 163, 184, .25);
            box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 12px 28px -14px rgba(15, 23, 42, .18)
        }

        .dark .glass {
            background: rgba(30, 41, 59, .62);
            border-color: rgba(148, 163, 184, .16);
            box-shadow: 0 12px 28px -14px rgba(0, 0, 0, .6)
        }

        .inp {
            width: 100%;
            border-radius: .75rem;
            border: 1px solid #cbd5e1;
            padding: .6rem .8rem;
            background: rgba(255, 255, 255, .6);
            transition: .15s
        }

        .dark .inp {
            border-color: #475569;
            background: rgba(15, 23, 42, .5)
        }

        .inp:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, .25)
        }

        .dark .inp option {
            background: #1e293b
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            border-radius: .75rem;
            padding: .55rem 1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00529C, #0a74d4);
            color: #fff;
            box-shadow: 0 6px 16px -8px #00529C;
            transition: .15s
        }

        .btn:hover {
            transform: translateY(-1px)
        }

        .btn:disabled {
            opacity: .4;
            pointer-events: none
        }

        .btn2 {
            background: #e2e8f0;
            color: #0f172a;
            box-shadow: none
        }

        .dark .btn2 {
            background: #334155;
            color: #e2e8f0
        }

        .icon-btn {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: .75rem;
            display: grid;
            place-items: center;
            transition: .15s
        }

        .icon-btn:hover {
            background: rgba(148, 163, 184, .2)
        }

        th {
            font-weight: 600;
            padding: .75rem 0;
            white-space: nowrap
        }

        tbody td {
            padding: .7rem 0
        }

        tbody tr:hover {
            background: rgba(14, 165, 233, .07)
        }

        .dark ::-webkit-calendar-picker-indicator {
            filter: invert(.8)
        }

        @media print {

            aside,
            header,
            .noprint {
                display: none !important
            }
        }

        @keyframes fi {
            from {
                opacity: .4;
                transform: translateY(4px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        #view>* {
            animation: fi .18s ease-out
        }
    </style>
</head>

<body class="text-slate-800 dark:text-slate-100 font-sans antialiased">

    <!-- LOGIN -->
    <section id="login" class="relative min-h-screen hidden items-center justify-center p-4 bg-gradient-to-br from-bri via-sky-700 to-slate-900"><button class="themeBtn icon-btn absolute top-4 right-4 text-white" onclick="toggleTheme()" aria-label="Ganti tema"></button>
        <div class="glass w-full max-w-sm rounded-3xl p-8 shadow-xl">
            <img src="assets/logo.png" alt="BRILink" class="h-12 mb-4" onerror="this.outerHTML=LOGO_SVG">
            <h1 class="text-2xl font-bold text-bri dark:text-white">Manajemen Kas BRILink</h1>
            <p class="text-sm text-slate-500 mb-6">Masuk untuk mencatat transaksi hari ini.</p>
            <input id="lu" class="inp mb-3" placeholder="Username" autocomplete="username">
            <input id="lp" type="password" class="inp mb-4" placeholder="Password" autocomplete="current-password">
            <button class="btn w-full justify-center" onclick="doLogin()"><i data-lucide="log-in" class="w-4"></i>Masuk</button>
            <p class="text-center text-xs text-slate-500 mt-6">MHC Media • ©2026</p>
        </div>
    </section>

    <!-- APP -->
    <div id="app" class="hidden min-h-screen">
        <aside id="side" class="fixed inset-y-0 left-0 z-30 w-60 -translate-x-full md:translate-x-0 transition-transform glass border-r border-slate-200 dark:border-slate-700 p-4 flex flex-col">
            <div class="flex items-center gap-2 text-xl font-bold text-bri dark:text-white mb-6 px-2"><span class="w-9 h-9 rounded-xl bg-bri text-white grid place-items-center"><i data-lucide="landmark" class="w-5"></i></span>Kas BRILink</div>
            <nav id="nav" class="space-y-1 flex-1 overflow-y-auto"></nav>

        </aside>
        <div class="md:ml-60">
            <header class="sticky top-0 z-20 glass flex items-center gap-3 px-4 py-3 border-b border-slate-200 dark:border-slate-700">
                <button class="md:hidden" onclick="side.classList.toggle('-translate-x-full')"><i data-lucide="menu"></i></button>
                <h2 id="title" class="font-bold flex-1"></h2><span id="brchip" onclick="location.hash='#tutup'" class="cursor-pointer text-xs font-bold px-2 py-1 rounded-full bg-slate-500/20">Cabang: ...</span>
                <button id="who" onclick="toggleAcct(event)" title="Menu akun" class="text-sm text-slate-500 hover:text-bri flex items-center gap-1"></button>
                <div id="acct" class="hidden absolute right-3 top-14 z-30 w-60 glass rounded-2xl p-2 shadow-xl">
                    <div id="acctInfo" class="px-3 py-2 text-xs text-slate-500"></div><button class="w-full flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-slate-500/10 text-left" onclick="$('acct').classList.add('hidden');pwForm()"><i data-lucide="key-round" class="w-4"></i>Ubah password</button><button class="w-full flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-red-500/10 text-left text-red-500 font-bold" onclick="$('acct').classList.add('hidden');doLogout()"><i data-lucide="log-out" class="w-4"></i>Keluar / Logout</button>
                </div>
                <button class="themeBtn icon-btn" onclick="toggleTheme()" aria-label="Ganti tema"></button>
            </header>
            <main id="view" class="p-4 max-w-6xl mx-auto"></main>
            <footer class="text-center text-xs text-slate-500 py-6 noprint">MHC Media • ©2026</footer>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/50 p-4">
        <div id="mbody" class="bg-white dark:bg-slate-800 rounded-2xl p-6 w-full max-w-md max-h-[90vh] overflow-auto"></div>
    </div>
    <div id="toast" class="fixed bottom-4 right-4 z-50 space-y-2"></div>
    <div id="spin" class="fixed top-0 inset-x-0 h-1 bg-oren hidden"></div>

    <script>
        /* ===== Konfigurasi: tempel URL Web App Apps Script di sini ===== */
        const LOGO_SVG = '<svg viewBox="0 0 190 48" class="h-12 mb-4 text-bri dark:text-white" role="img" aria-label="BRILink"><rect y="2" width="44" height="44" rx="12" fill="#00529C"/><path d="M12 24h20M26 15l9 9-9 9" stroke="#F37021" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="35" font-family="Plus Jakarta Sans,sans-serif" font-weight="800" font-size="30" fill="currentColor">BRI</text><text x="106" y="35" font-family="Plus Jakarta Sans,sans-serif" font-weight="800" font-size="30" fill="#F37021">Link</text></svg>';
        const API_URL = 'https://script.google.com/macros/s/AKfycbzhJwiVrDXYcRVxr7Q8vD3AkI3WpkO38mnkKrGxUB4vfFsE6b_8uJ_BWm5D9LTppQGtqQ/exec';

        /* ===== services/api.js (retry + loading + token) ===== */
        const S = {
            token: localStorage.token,
            user: JSON.parse(localStorage.user || 'null'),
            last: Date.now()
        };
        const $ = id => document.getElementById(id);
        const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
        const today = () => new Date().toLocaleDateString('sv-SE');

        function toast(m, ok = true) {
            const d = document.createElement('div');
            d.className = 'px-4 py-2 rounded-xl text-white shadow ' + (ok ? 'bg-emerald-600' : 'bg-red-600');
            d.textContent = m;
            $('toast').append(d);
            setTimeout(() => d.remove(), 3500);
        }
        const READ = {
                getDashboard: 60,
                getTransactions: 30,
                getExpenses: 30,
                getReports: 30,
                getUsers: 30,
                getCustomers: 60,
                getTutupKas: 30,
                getAnalytics: 120,
                getLogs: 15,
                getSettings: 60,
                getBranch: 10,
                getSaldo: 10
            },
            CACHE = new Map();
        let OFFQ = JSON.parse(localStorage.offq || '[]');
        const saveQ = () => localStorage.offq = JSON.stringify(OFFQ);
        async function syncQueue() {
            while (OFFQ.length && navigator.onLine && S.token) {
                try {
                    await apiRaw('addTransaction', OFFQ[0], 1);
                    OFFQ.shift();
                    saveQ();
                    CACHE.clear();
                    toast('Transaksi offline terkirim');
                } catch (e) {
                    if (e.app) {
                        OFFQ.shift();
                        saveQ();
                        continue;
                    }
                    break;
                }
            }
        }
        const INFLIGHT = new Set();

        function revalidate(action, payload, key) {
            if (INFLIGHT.has(key)) return;
            INFLIGHT.add(key);
            apiRaw(action, payload, 1, true).then(d => {
                if (d === undefined) return;
                const v = JSON.stringify(d),
                    old = CACHE.get(key);
                CACHE.set(key, {
                    t: Date.now(),
                    v
                });
                if (!old || old.v !== v) softRefresh();
            }).catch(() => {}).finally(() => INFLIGHT.delete(key));
        }

        function softRefresh() {
            const a = document.activeElement;
            if (S.token && !$('modal').classList.contains('flex') && !(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) route(true);
        }
        async function prefetch() { // hangatkan cache halaman lain agar klik menu terasa instan
            if (!S.token || !navigator.onLine) return;
            loadLib('chart').catch(() => {});
            const jobs = [
                ['getDashboard', {}],
                ['getTransactions', {
                    q: '',
                    jenis: '',
                    dari: '',
                    sampai: '',
                    page: 1,
                    size: 10
                }],
                ['getExpenses', {}],
                ['getCustomers', {}],
                ['getTutupKas', {}]
            ];
            for (const [a, p] of jobs) {
                const k = a + JSON.stringify(p),
                    h = CACHE.get(k);
                if (h && Date.now() - h.t < READ[a] * 1000) continue;
                try {
                    const d = await apiRaw(a, p, 1, true);
                    if (d !== undefined) CACHE.set(k, {
                        t: Date.now(),
                        v: JSON.stringify(d)
                    });
                } catch (e) {
                    return;
                }
            }
        }
        async function api(action, payload = {}, tries = 3) {
            if (action === 'addTransaction' && !navigator.onLine) {
                const w = new Date().toTimeString().slice(0, 5);
                OFFQ.push({
                    ...payload,
                    waktu: w
                });
                saveQ();
                toast('Offline: transaksi disimpan di perangkat, dikirim otomatis saat online');
                return {
                    ...payload,
                    id: 'OFFLINE',
                    waktu: w,
                    laba: Number(payload.biaya_admin) - Number(payload.biaya_operasional || 0),
                    operator: S.user.username
                };
            }
            if (API_URL.startsWith('GANTI')) {
                toast('API_URL belum diisi di index.html', false);
                throw new Error('API_URL belum diisi');
            }
            const ttl = READ[action],
                key = action + JSON.stringify(payload),
                hit = ttl && CACHE.get(key);
            const rid = RID;
            if (hit) {
                const age = Date.now() - hit.t;
                if (age < ttl * 1000) return JSON.parse(hit.v);
                if (age < 600000) {
                    revalidate(action, payload, key);
                    return JSON.parse(hit.v);
                } // tampil instan, segarkan di latar
            }
            const d = await apiRaw(action, payload, tries);
            if (ttl && d !== undefined) CACHE.set(key, {
                t: Date.now(),
                v: JSON.stringify(d)
            });
            else if (action !== 'logError') {
                CACHE.clear();
                if (!/^(login|logout)$/.test(action)) setTimeout(prefetch, 600);
            }
            if (ttl && rid !== RID) throw new Error('cancel'); // pindah menu sebelum data tiba: buang hasil lama
            return d;
        }
        async function apiRaw(action, payload = {}, tries = 3, quiet = false) {
            $('spin').classList.remove('hidden');
            try {
                for (let i = 0; i < tries; i++) {
                    try {
                        const r = await fetch(API_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action,
                                token: S.token,
                                payload
                            })
                        }); // text/plain: tanpa preflight CORS
                        const j = await r.json();
                        if (!j.success) {
                            if (j.data && j.data.expired) return logoutLocal();
                            throw Object.assign(new Error(j.message), {
                                app: true
                            });
                        }
                        S.last = Date.now();
                        return j.data;
                    } catch (e) {
                        if (e.app || i === tries - 1) throw e;
                        await new Promise(r => setTimeout(r, 800 * (i + 1)));
                    }
                }
            } catch (e) {
                if (!quiet) toast(e.message || 'Gagal terhubung ke server', false);
                throw e;
            } finally {
                $('spin').classList.add('hidden');
            }
        }

        /* ===== services/auth.js ===== */
        let LOGGING = false;
        async function doLogin() {
            if (LOGGING) return;
            if (!val('lu') || !val('lp')) return toast('Isi username dan password', false);
            LOGGING = true;
            try {
                await doLogin0();
            } finally {
                LOGGING = false;
                $('lp').value = '';
            }
        }
        async function doLogin0() {
            try {
                const d = await api('login', {
                    username: $('lu').value,
                    password: $('lp').value
                });
                S.token = localStorage.token = d.token;
                S.user = d.user;
                localStorage.user = JSON.stringify(d.user);
                boot();
            } catch (e) {}
        }

        function logoutLocal() {
            CACHE.clear();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            S.token = null;
            location.hash = '';
            location.reload();
        }
        async function doLogout() {
            try {
                await api('logout', {
                    token: S.token
                });
            } catch (e) {}
            logoutLocal();
        }
        setInterval(() => {
            if (S.token && Date.now() - S.last > 30 * 60000) {
                toast('Logout otomatis: tidak aktif', false);
                logoutLocal();
            }
        }, 30000);

        /* ===== components/modal.js ===== */
        function openModal(html) {
            $('mbody').innerHTML = html;
            $('modal').classList.replace('hidden', 'flex');
            icons();
        }

        function closeModal() {
            $('modal').classList.replace('flex', 'hidden');
        }
        const LIB = {
                chart: 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js',
                xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
                jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
                atable: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',
                barcode: 'https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js'
            },
            LOADED = {};
        const loadLib = k => LOADED[k] = LOADED[k] || new Promise((ok, no) => {
            const e = document.createElement('script');
            e.src = LIB[k];
            e.onload = ok;
            e.onerror = () => {
                delete LOADED[k];
                no(new Error('Gagal memuat pustaka ' + k + ', periksa koneksi'));
            };
            document.head.appendChild(e);
        });
        const icons = () => {
            try {
                window.lucide && lucide.createIcons();
            } catch (e) {}
        };

        /* ===== components/sidebar.js ===== */
        const PAGES = [
            ['dashboard', 'Dashboard', 'home'],
            ['transaksi', 'Transaksi', 'credit-card'],
            ['pengeluaran', 'Pengeluaran', 'wallet'],
            ['pelanggan', 'Pelanggan', 'contact'],
            ['tutup', 'Buka/Tutup Kas', 'vault'],
            ['analitik', 'Analitik', 'bar-chart-3'],
            ['laporan', 'Laporan', 'file-text'],
            ['setting', 'Pengaturan', 'settings'],
            ['users', 'Pengguna', 'users', 'Admin'],
            ['log', 'Log Aktivitas', 'history', 'Admin']
        ];
        const NAVC = {
            dashboard: 'bg-sky-500/15 text-sky-500',
            transaksi: 'bg-emerald-500/15 text-emerald-500',
            pengeluaran: 'bg-rose-500/15 text-rose-500',
            laporan: 'bg-violet-500/15 text-violet-500',
            users: 'bg-orange-500/15 text-orange-500',
            setting: 'bg-teal-500/15 text-teal-500',
            pelanggan: 'bg-cyan-500/15 text-cyan-500',
            tutup: 'bg-amber-500/15 text-amber-500',
            analitik: 'bg-indigo-500/15 text-indigo-500',
            log: 'bg-slate-500/15 text-slate-500'
        };

        function nav() {
            const cur = location.hash.slice(1) || 'dashboard';
            $('nav').innerHTML = PAGES.filter(p => !p[3] || p[3] === S.user.role).map(p =>
                `<a href="#${p[0]}" onclick="side.classList.add('-translate-x-full')" class="flex items-center gap-3 px-2 py-2 rounded-xl transition ${cur === p[0] ? 'bg-bri text-white font-bold shadow-md' : 'hover:bg-slate-500/10'}"><span class="w-9 h-9 rounded-lg grid place-items-center ${cur === p[0] ? 'bg-white/20 text-white' : NAVC[p[0]]}"><i data-lucide="${p[2]}" class="w-5 h-5"></i></span>${p[1]}</a>`).join('');
        }

        /* ===== Router ===== */
        const JENIS = ['Transfer', 'Tarik Tunai', 'Setor Tunai', 'BRIVA', 'Pembayaran Tagihan', 'Top Up E-Wallet', 'Pulsa', 'Token PLN', 'Cicilan', 'QRIS', 'Lainnya'];
        const KAT = ['Listrik', 'Internet', 'Sewa', 'ATK', 'Operasional', 'Lainnya'];
        const opt = a => a.map(x => `<option>${x}</option>`).join('');
        let RID = 0,
            PREF = false;
        const SKEL = `<div class="animate-pulse space-y-3"><div class="h-28 rounded-3xl bg-slate-500/15"></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${'<div class="h-24 rounded-2xl bg-slate-500/15"></div>'.repeat(4)}</div><div class="h-64 rounded-2xl bg-slate-500/15"></div></div>`;
        async function route(silent) {
            const rid = ++RID,
                p = location.hash.slice(1) || 'dashboard',
                pg = PAGES.find(x => x[0] === p) || PAGES[0];
            $('title').textContent = pg[1];
            nav();
            icons();
            loadBranch();
            if (silent !== true) {
                $('view').innerHTML = SKEL;
                scrollTo(0, 0);
            } // halaman langsung berganti, data menyusul
            try {
                await VIEWS[pg[0]]();
            } catch (e) {
                if (rid !== RID || e.message === 'cancel') return;
                $('view').innerHTML = `<div class="glass rounded-2xl p-6 text-center"><p class="text-red-500 mb-3">${escH(e.message)}</p><button class="btn" onclick="route()">Coba lagi</button></div>`;
            }
            if (rid === RID) {
                paintBanner();
                icons();
            }
            if (!PREF && S.token) {
                PREF = true;
                setTimeout(prefetch, 400);
            }
        }

        function boot() {
            const ok = !!S.token;
            $('login').classList.toggle('hidden', ok);
            $('login').classList.toggle('flex', !ok);
            $('app').classList.toggle('hidden', !ok);
            if (ok) {
                $('who').innerHTML = `<i data-lucide="user-round" class="w-4"></i>${escH(S.user.nama)} (${S.user.role})<i data-lucide="chevron-down" class="w-4"></i>`;
                $('acctInfo').textContent = S.user.nama + ' · ' + S.user.role + ' (@' + S.user.username + ')';
                route();
            }
            paintTheme();
        }
        addEventListener('hashchange', () => S.token && route());
        window.onerror = (m) => {
            if (S.token) api('logError', {
                m
            }, 1).catch(() => {});
        };

        const isDark = () => document.documentElement.classList.contains('dark');

        function paintTheme() {
            const sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
                moon = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
            document.querySelectorAll('.themeBtn').forEach(b => {
                b.style.cursor = 'pointer';
                b.title = isDark() ? 'Ganti ke tema terang' : 'Ganti ke tema gelap';
                b.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${isDark() ? sun : moon}</svg>`;
            });
            icons();
        }

        function toggleTheme() {
            const d = document.documentElement.classList.toggle('dark');

            const ds = {
                label,
                data
            };
            if (type === 'line') {
                const g = ctx.createLinearGradient(0, 0, 0, 260);
                g.addColorStop(0, 'rgba(56,189,248,.5)');
                g.addColorStop(1, 'rgba(56,189,248,0)');
                Object.assign(ds, {
                    fill: true,
                    backgroundColor: g,
                    borderColor: '#38bdf8',
                    borderWidth: 3,
                    tension: .4,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: '#38bdf8',
                    pointHoverBorderWidth: 3
                });
            } else if (type === 'bar') Object.assign(ds, {
                backgroundColor: '#F37021',
                borderRadius: 8,
                borderSkipped: false,
                maxBarThickness: 28
            });
            else Object.assign(ds, {
                backgroundColor: pal,
                borderWidth: 0,
                spacing: 4,
                borderRadius: 8,
                hoverOffset: 8
            });
            const o = {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 900,
                    easing: 'easeOutQuart'
                },
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                plugins: {
                    legend: {
                        display: type === 'doughnut',
                        position: 'bottom',
                        labels: {
                            color: txt,
                            usePointStyle: true,
                            boxWidth: 8,
                            padding: 14,
                            font: {
                                family: 'Plus Jakarta Sans'
                            }
                        }
                    },
                    tooltip: {
                        backgroundColor: dk ? '#0f172a' : '#fff',
                        titleColor: dk ? '#f1f5f9' : '#0f172a',
                        bodyColor: txt,
                        borderColor: grid,
                        borderWidth: 1,
                        padding: 10,
                        cornerRadius: 10,
                        displayColors: type === 'doughnut',
                        boxPadding: 4
                    }
                }
            };
            if (type === 'doughnut') o.cutout = '72%';
            else o.scales = {
                x: {
                    grid: {
                        display: false
                    },
                    border: {
                        display: false
                    },
                    ticks: {
                        color: txt
                    }
                },
                y: {
                    beginAtZero: true,
                    grid: {
                        color: grid
                    },
                    border: {
                        display: false
                    },
                    ticks: {
                        color: txt,
                        precision: 0
                    }
                }
            };
            charts.push(new Chart(ctx, {
                type,
                data: {
                    labels,
                    datasets: [ds]

                options: o

      <div class="glass rounded-2xl overflow-x-auto"><table class="w-full text-sm"><thead class="text-left text-slate-500"><tr><th class="p-3">Nama</th><th>Username</th><th>Role</th><th>Status</th><th>Login terakhir</th><th></th></tr></thead><tbody>${d.map(u => `<tr class="border-t border-slate-200 dark:border-slate-700"><td class="p-3">${escH(u.nama)}</td><td>${escH(u.username)}</td><td>${u.role}</td><td><span class="px-2 py-0.5 rounded-full text-xs ${u.status === 'aktif' ? 'bg-emerald-500/15 text-emerald-500' : 'bg-slate-500/20 text-slate-500'}">${u.status}</span></td><td>${u.last_login || '-'}</td><td class="whitespace-nowrap"><button class="btn btn2 !py-1 !px-3 text-xs" onclick="userForm('${u.id}')"><i data-lucide="pencil" class="w-3"></i>Edit</button> ${u.role === 'Operator' ? `<button class="btn !py-1 !px-3 text-xs !bg-red-600" onclick="delUser('${u.id}')"><i data-lucide="trash-2" class="w-3"></i>Hapus</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
            }
        };

        /* ===== Aksi ===== */
        const val = id => $(id).value;

        function need(...ids) {
            for (const i of ids)
                if (!val(i)) {
                    toast('Lengkapi isian wajib', false);
                    return false;
                } return true;
        }
        const openCust = n => {
            VIEWS.f = {
                q: n,
                jenis: '',
                dari: '',
                sampai: ''
            };
            location.hash = '#transaksi';
        };
        let BR = null;
        async function loadBranch() {
            try {
                BR = await api('getBranch');
            } catch (e) {
                return;
            }
            const c = $('brchip'),
                on = BR.open && !BR.basi;
            if (!c) return;
            c.textContent = on ? 'Cabang BUKA' : BR.basi ? 'Sesi belum ditutup' : 'Cabang TUTUP';
            c.className = 'cursor-pointer text-xs font-bold px-2 py-1 rounded-full ' + (on ? 'bg-emerald-500/15 text-emerald-500' : 'bg-red-500/15 text-red-500');
            paintBanner();
        }

        function paintBanner() {
            const old = $('brbanner');
            if (old) old.remove();
            const v = $('view');
            if (!v || !BR || (BR.open && !BR.basi) || location.hash === '#tutup') return;
            v.insertAdjacentHTML('afterbegin', `<div id="brbanner" class="rounded-2xl p-4 mb-3 bg-red-500/10 border border-red-500/30 flex flex-wrap items-center gap-3"><i data-lucide="lock" class="w-5 text-red-500"></i><div class="flex-1 text-sm"><b>${BR.basi ? 'Sesi kas sebelumnya belum ditutup' : 'Cabang belum dibuka'}</b><br>Transaksi baru tidak bisa dicatat sebelum ${BR.basi ? 'tutup kas' : 'buka kas dan isi saldo kas awal'}.</div><a href="#tutup" class="btn">${BR.basi ? 'Tutup kas' : 'Buka kas'}</a></div>`);
            icons();
        }
        async function doBuka() {
            if (!need('o_saldo', 'o_rek') || !confirm('Buka kas dengan kas fisik ' + rp(val('o_saldo')) + ' dan saldo rekening BRILink ' + rp(val('o_rek')) + '?')) return;
            try {
                await api('bukaKas', {
                    saldo_awal: val('o_saldo'),
                    saldo_rekening: val('o_rek')
                });
                toast('Kas dibuka, transaksi dapat dimulai');
                route();
            } catch (e) {}
        }
        async function saveTutup() {
            if (!need('k_fisik')) return;
            if (!confirm('Tutup kas sekarang? Saldo awal akan direset ke 0 dan transaksi baru tidak bisa dicatat sampai kas dibuka lagi.')) return;
            try {
                await api('addTutupKas', {
                    kas_fisik: val('k_fisik'),
                    catatan: val('k_cat')
                });
                toast('Kas ditutup');
                route();
            } catch (e) {}
        }

        function custForm(i) {
            const c = i === undefined ? {} : CUST[i];
            openModal(`<h3 class="font-bold mb-3">${c.nama ? 'Edit' : 'Tambah'} pelanggan</h3><div class="space-y-2"><input id="c_n" class="inp" placeholder="Nama" value="${escH(c.nama || '')}"><input id="c_h" class="inp" placeholder="No. HP" inputmode="tel" value="${escH(c.no_hp || '')}"><select id="c_b" class="inp"><option value="">Bank (opsional)</option>${opt(Object.keys(BANKS))}</select><input id="c_r" class="inp" inputmode="numeric" placeholder="No. rekening utama" value="${escH(c.no_rekening || '')}"><input id="c_c" class="inp" placeholder="Catatan" value="${escH(c.catatan || '')}">
  ${c.nama && c.jumlah ? '<p class="text-xs text-slate-500">Mengubah nama ikut memperbarui seluruh riwayat transaksi pelanggan ini.</p>' : ''}
  <div class="flex gap-2 justify-end"><button class="btn btn2" onclick="closeModal()">Batal</button><button class="btn" onclick="saveCust(${i === undefined ? -1 : i})">Simpan</button></div></div>`);
        }
        async function saveCust(i) {
            if (!need('c_n')) return;
            const c = i < 0 ? {} : CUST[i];
            try {
                await api('updateCustomer', {
                    id: c.id || '',
                    nama_lama: c.nama || '',
                    nama: val('c_n'),
                    no_hp: val('c_h'),
                    no_rekening: val('c_r'),
                    bank: $('c_b') ? val('c_b') : '',
                    catatan: val('c_c')
                });
                closeModal();
                toast('Pelanggan disimpan');
                route();
            } catch (e) {}
        }
        async function delCust(i) {
            const c = CUST[i];
            if (!confirm('Hapus pelanggan ' + c.nama + '?')) return;
            try {
                await api('deleteCustomer', {
                    id: c.id,
                    nama: c.nama
                });
                toast('Pelanggan dihapus');
                route();
            } catch (e) {}
        }
        async function saveSaldo() {
            if (!need('s_saldo')) return;
            try {
                await api('saveSettings', {
                    saldo_awal: val('s_saldo')
                });
                toast('Saldo awal disimpan');
            } catch (e) {}
        }
        async function doRestore() {
            if (!need('s_rst') || !confirm('Data saat ini akan DITIMPA oleh isi file backup (cadangan otomatis dibuat dulu). Lanjutkan?')) return;
            try {
                await api('restoreBackup', {
                    fileId: val('s_rst')
                });
                toast('Restore berhasil, memuat ulang...');
                setTimeout(logoutLocal, 1500);
            } catch (e) {}
        }
        async function verify() {
            if (!val('vcode').trim()) return toast('Masukkan kode barcode', false);
            try {
                const r = await api('getVerify', {
                    code: val('vcode').trim()
                });
                r.valid ? toast(`Asli: dibuat oleh ${r.user}, ${r.waktu}`) : toast('Kode tidak ditemukan, laporan tidak terverifikasi', false);
            } catch (e) {}
        }
        /* ===== Form nomor tujuan: bank, panjang digit, dan validasi otomatis per jenis ===== */
        const BANKS = {
            'BRI': [15, 15],
            'BNI': [10, 10],
            'Mandiri': [13, 13],
            'BCA': [10, 10],
            'BSI': [10, 10],
            'BTN': [16, 16],
            'CIMB Niaga': [12, 14],
            'Permata': [10, 10],
            'Danamon': [10, 12],
            'Bank lain': [6, 20]
        };
        const EWALLET = ['DANA', 'OVO', 'GoPay', 'ShopeePay', 'LinkAja'];

        function fieldCfg(j, bank) {
            switch (j) {
                case 'Transfer':
                case 'Setor Tunai': {
                    const r = BANKS[bank] || [6, 20];
                    return {
                        label: 'No. rekening tujuan',
                        pick: Object.keys(BANKS),
                        pickLabel: 'Pilih bank tujuan',
                        min: r[0],
                        max: r[1],
                        mode: 'digits',
                        req: true
                    };
                }
                case 'BRIVA':
                    return {
                        label: 'No. BRIVA / Virtual Account', min: 10, max: 20, mode: 'digits', req: true
                    };
                case 'Top Up E-Wallet':
                    return {
                        label: 'No. HP akun e-wallet', pick: EWALLET, pickLabel: 'Pilih e-wallet', min: 10, max: 14, mode: 'hp', req: true
                    };
                case 'Pulsa':
                    return {
                        label: 'No. HP tujuan', min: 10, max: 14, mode: 'hp', req: true
                    };
                case 'Token PLN':
                    return {
                        label: 'No. meter / ID pelanggan PLN', min: 11, max: 12, mode: 'digits', req: true
                    };
                case 'Pembayaran Tagihan':
                    return {
                        label: 'ID pelanggan / no. tagihan', min: 5, max: 20, mode: 'digits', req: true
                    };
                case 'Cicilan':
                    return {
                        label: 'No. kontrak / ID pembayaran', min: 5, max: 25, mode: 'alnum', req: true
                    };
                case 'QRIS':
                    return {
                        label: 'Nama merchant', min: 1, max: 40, mode: 'text', req: true
                    };
                default:
                    return {
                        label: 'No. rekening / nomor tujuan (opsional)', min: 0, max: 40, mode: 'text', req: false
                    };
            }
        }

        function onJenis(keepBank, bankVal) {
            const j = val('f_jenis'),
                sel = $('f_bank'),
                cur = keepBank ? val('f_bank') : (bankVal || ''),
                c0 = fieldCfg(j, cur);
            if (c0.pick) {
                sel.classList.remove('hidden');
                sel.innerHTML = `<option value="">${c0.pickLabel}</option>` + c0.pick.map(x => `<option>${x}</option>`).join('');
                sel.value = cur;
            } else {
                sel.classList.add('hidden');
                sel.innerHTML = '';
            }
            const cfg = fieldCfg(j, val('f_bank')),
                r = $('f_rek');
            r.placeholder = cfg.label;
            r.maxLength = cfg.max;
            r.inputMode = cfg.mode === 'digits' || cfg.mode === 'hp' ? 'numeric' : 'text';
            fmtRek();
            calc();
        }

        function fmtRek() {
            const cfg = fieldCfg(val('f_jenis'), val('f_bank')),
                r = $('f_rek');
            let v = r.value;
            if (cfg.mode === 'digits') v = v.replace(/\D/g, '');
            else if (cfg.mode === 'hp') v = v.replace(/[^\d+]/g, '').replace(/^\+62/, '0').replace(/^62/, '0').replace(/\D/g, '');
            else if (cfg.mode === 'alnum') v = v.replace(/[^A-Za-z0-9-]/g, '');
            v = v.slice(0, cfg.max);
            if (v !== r.value) r.value = v;
            const len = v.length,
                ok = len >= cfg.min && len <= cfg.max,
                h = $('f_hint');
            h.textContent = cfg.mode === 'text' ? '' : `${len}/${cfg.max} digit${cfg.min === cfg.max ? '' : ' (minimal ' + cfg.min + ')'}${val('f_bank') ? ' · ' + val('f_bank') : ''}`;
            h.className = 'text-xs -mt-1 ' + (!len ? 'text-slate-500' : ok ? 'text-emerald-500' : 'text-amber-500');
            r.classList.toggle('!border-red-500', len > 0 && !ok);
        }

        function rekError() {
            const cfg = fieldCfg(val('f_jenis'), val('f_bank')),
                v = val('f_rek').trim();
            if (cfg.pick && !val('f_bank')) return cfg.pickLabel;
            if (!v) return cfg.req ? cfg.label + ' wajib diisi' : '';
            if (cfg.mode === 'hp' && !/^08/.test(v)) return 'No. HP harus diawali 08';
            if (cfg.mode !== 'text' && (v.length < cfg.min || v.length > cfg.max)) return `${cfg.label} harus ${cfg.min === cfg.max ? cfg.min : cfg.min + '-' + cfg.max} digit${val('f_bank') ? ' untuk ' + val('f_bank') : ''} (diisi ${v.length})`;
            return '';
        }
        const kasDelta = t => t.jenis_transaksi === 'Tarik Tunai' ? Number(t.biaya_admin) - Number(t.nominal) : Number(t.nominal) + Number(t.biaya_admin);
        const kasTxt = t => {
            const d = kasDelta(t);
            return (d >= 0 ? 'Kas masuk ' : 'Kas keluar ') + rp(Math.abs(d));
        };
        const onlyDigits = e => {
            e.value = e.value.replace(/\D/g, '');
        };
        const lenTxt = r => r[0] === r[1] ? r[1] + ' digit' : r[0] + '-' + r[1] + ' digit';

        function asalHint() {
            const i = $('f_rasal'),
                r = BANKS[val('f_basal')] || BANKS['Bank lain'];
            i.value = i.value.replace(/\D/g, '').slice(0, r[1]);
            $('f_asalhint').textContent = i.value ? `${val('f_basal') || 'Bank'}: ${lenTxt(r)} (${i.value.length}/${r[1]})` : '';
        }

        function validAsal() {
            const r = val('f_rasal').trim();
            if (!r) return '';
            if (!val('f_basal')) return 'Pilih bank rekening asal';
            const c = BANKS[val('f_basal')];
            return r.length < c[0] || r.length > c[1] ? `Rekening asal ${val('f_basal')} harus ${lenTxt(c)} (diisi ${r.length})` : '';
        }
        const validHp = () => {
            const h = val('f_hp').trim();
            return h && !/^(08|62)\d{8,12}$/.test(h) ? 'No. HP pelanggan tidak valid (awali 08 atau 62, 10-14 digit)' : '';
        };

        function trxForm(t = {}) {
            if (!t.id && BR && (!BR.open || BR.basi)) {
                toast(BR.basi ? 'Tutup kas sesi sebelumnya dulu' : 'Buka kas dulu sebelum mencatat transaksi', false);
                location.hash = '#tutup';
                return;
            }
            openModal(`<h3 class="font-bold mb-3">${t.id ? 'Edit' : 'Tambah'} transaksi</h3><div class="space-y-2">
    <div class="grid grid-cols-2 gap-2"><input id="f_tgl" type="date" class="inp" value="${t.tanggal || today()}"><input id="f_wkt" type="time" class="inp" value="${t.waktu || new Date().toTimeString().slice(0, 5)}"></div>
    <select id="f_jenis" class="inp" onchange="onJenis()">${opt(JENIS)}</select>
    <input id="f_pel" list="dl_pel" class="inp" placeholder="Nama pelanggan" value="${escH(t.pelanggan || '')}" onchange="fillCust()"><datalist id="dl_pel"></datalist>
    <input id="f_hp" class="inp" inputmode="numeric" maxlength="14" placeholder="No. HP pelanggan (opsional)" value="${escH(t.no_hp || '')}" oninput="onlyDigits(this)">
    <select id="f_bank" class="inp hidden" onchange="onJenis(true)"></select>
    <input id="f_rek" class="inp" autocomplete="off" value="${escH(t.rekening_tujuan || '')}" oninput="fmtRek()">
    <p id="f_hint" class="text-xs text-slate-500 -mt-1"></p>
    <input id="f_ref" class="inp" placeholder="No. referensi / no. transaksi (struk bank)" value="${escH(t.no_referensi || '')}">
    <select id="f_met" class="inp">${opt(['Tunai', 'Transfer', 'QRIS', 'Saldo'])}</select>
    <input id="f_nom" type="number" min="1" class="inp" placeholder="Nominal" value="${t.nominal || ''}" oninput="calc()">
    <input id="f_adm" type="number" min="0" class="inp" placeholder="Biaya admin (pendapatan)" value="${t.biaya_admin ?? ''}" oninput="calc()">
    <input id="f_ops" type="number" min="0" class="inp" placeholder="Biaya operasional (opsional)" value="${t.id ? Number(t.biaya_admin) - Number(t.laba) : 0}" oninput="calc()">
    <div class="rounded-xl bg-slate-500/10 p-3 text-sm space-y-1"><div>Laba: <b id="f_laba">-</b></div><div>Dampak kas: <b id="f_kas">-</b></div><div class="text-xs text-slate-500">Saldo kas <b id="f_sk">-</b> · Saldo rekening BRILink <b id="f_sr">-</b></div><div id="f_warn" class="text-red-500 font-bold"></div></div>
    <details class="rounded-xl border border-slate-500/30 p-3" ${t.rekening_asal ? 'open' : ''}><summary class="cursor-pointer text-sm font-bold">Rekening asal (opsional)</summary><div class="space-y-2 mt-2">
      <select id="f_basal" class="inp" onchange="asalHint()"><option value="">Bank asal</option>${opt(Object.keys(BANKS))}</select>
      <input id="f_rasal" class="inp" inputmode="numeric" placeholder="No. rekening asal" value="${escH(t.rekening_asal || '')}" oninput="asalHint()"><div id="f_asalhint" class="text-xs text-slate-500"></div>
      <label class="flex items-center gap-2 text-sm"><input id="f_milik" type="checkbox" checked>Rekening milik pelanggan sendiri (otomatis disimpan ke data pelanggan)</label></div></details>
    <input id="f_ket" class="inp" placeholder="Keterangan" value="${escH(t.keterangan || '')}">
    <div class="flex gap-2 justify-end"><button class="btn btn2" onclick="closeModal()">Batal</button><button class="btn" onclick="saveTrx('${t.id || ''}')">Simpan</button></div></div>`);
            if (t.jenis_transaksi) $('f_jenis').value = t.jenis_transaksi;
            onJenis(false, t.bank_tujuan);
            if (t.metode_bayar) $('f_met').value = t.metode_bayar;
            EDITT = t.id ? t : null;
            SALDO = null;
            api('getSaldo').then(x => {
                SALDO = x;
                calc();
            }).catch(() => {});
            api('getCustomers').then(c => {
                window.CUST = c;
                $('dl_pel').innerHTML = c.slice(0, 200).map(x => `<option value="${escH(x.nama)}">`).join('');
            }).catch(() => {});
            if (t.bank_asal) $('f_basal').value = t.bank_asal;
            asalHint();
            calc();
        }
        let SALDO = null,
            EDITT = null;
        const recDelta = t => t.jenis_transaksi === 'Tarik Tunai' ? Number(t.nominal) : -Number(t.nominal);

        function saldoMsg() {
            if (!SALDO) return '';
            const o = EDITT,
                mulai = BR && BR.mulai ? BR.mulai : 0;
            if (o && o.created_at && new Date(o.created_at.replace(' ', 'T') + '+07:00').getTime() < mulai) return ''; // periode tertutup tidak memengaruhi saldo
            const t = {
                jenis_transaksi: val('f_jenis'),
                nominal: Number(val('f_nom') || 0),
                biaya_admin: Number(val('f_adm') || 0)
            };
            const k = SALDO.kas + kasDelta(t) - (o ? kasDelta(o) : 0),
                r = SALDO.rek + recDelta(t) - (o ? recDelta(o) : 0);
            return k < 0 ? 'Saldo kas tidak cukup (tersedia ' + rp(SALDO.kas) + ')' : r < 0 ? 'Saldo rekening BRILink tidak cukup (tersedia ' + rp(SALDO.rek) + ')' : '';
        }
        const calc = () => {
            const a = Number(val('f_adm') || 0);
            $('f_laba').textContent = rp(a - Number(val('f_ops') || 0));
            $('f_kas').textContent = kasTxt({
                jenis_transaksi: val('f_jenis'),
                nominal: Number(val('f_nom') || 0),
                biaya_admin: a
            });
            if (SALDO) {
                $('f_sk').textContent = rp(SALDO.kas);
                $('f_sr').textContent = rp(SALDO.rek);
            }
            $('f_warn').textContent = saldoMsg();
        };

        function fillCust() {
            const c = (window.CUST || []).find(x => x.nama === val('f_pel'));
            if (!c) return;
            if (c.no_hp && !val('f_hp')) $('f_hp').value = c.no_hp;
            if (c.no_rekening && !val('f_rasal')) {
                if (c.bank) $('f_basal').value = c.bank;
                $('f_rasal').value = c.no_rekening;
                asalHint();
            }
        }
        let SAVING = false;
        async function saveTrx(id) {
            if (SAVING || !need('f_tgl', 'f_nom', 'f_adm')) return;
            if (Number(val('f_nom')) <= 0) return toast('Nominal harus lebih dari 0', false);
            const re = rekError();
            if (re) {
                toast(re, false);
                $('f_rek').focus();
                return;
            }
            const ve = validHp() || validAsal();
            if (ve) return toast(ve, false);
            const wm = saldoMsg();
            if (wm) return toast(wm, false);
            SAVING = true;
            try {
                const r = await api(id ? 'updateTransaction' : 'addTransaction', {
                    id,
                    tanggal: val('f_tgl'),
                    waktu: val('f_wkt'),
                    jenis_transaksi: val('f_jenis'),
                    pelanggan: val('f_pel'),
                    bank_tujuan: val('f_bank'),
                    rekening_tujuan: val('f_rek'),
                    no_referensi: val('f_ref'),
                    nominal: val('f_nom'),
                    biaya_admin: val('f_adm'),
                    biaya_operasional: val('f_ops'),
                    keterangan: val('f_ket'),
                    no_hp: val('f_hp'),
                    bank_asal: val('f_basal'),
                    rekening_asal: val('f_rasal'),
                    rek_milik_pelanggan: $('f_milik').checked,
                    metode_bayar: val('f_met')
                });
                closeModal();
                toast('Transaksi disimpan');
                route();
                if (!id && SET.auto && r) struk(r);
            } catch (e) {} finally {
                SAVING = false;
            }
        }

        function expForm(e = {}) {
            if (!e.id && BR && (!BR.open || BR.basi)) {
                toast('Buka kas dulu sebelum mencatat pengeluaran', false);
                location.hash = '#tutup';
                return;
            }
            openModal(`<h3 class="font-bold mb-3">${e.id ? 'Edit' : 'Tambah'} pengeluaran</h3><div class="space-y-2"><input id="e_tgl" type="date" class="inp" value="${e.tanggal || today()}"><select id="e_kat" class="inp">${opt(KAT)}</select><input id="e_des" class="inp" placeholder="Deskripsi" value="${escH(e.deskripsi || '')}"><input id="e_nom" type="number" min="0" class="inp" placeholder="Nominal" value="${e.nominal || ''}">
  <div class="flex gap-2 justify-end"><button class="btn btn2" onclick="closeModal()">Batal</button><button class="btn" onclick="saveExp('${e.id || ''}')">Simpan</button></div></div>`);
            if (e.kategori) $('e_kat').value = e.kategori;
        }
        async function saveExp(id) {
            if (!need('e_tgl', 'e_nom')) return;
            try {
                await api(id ? 'updateExpense' : 'addExpense', {
                    id,
                    tanggal: val('e_tgl'),
                    kategori: val('e_kat'),
                    deskripsi: val('e_des'),
                    nominal: val('e_nom')
                });
                closeModal();
                toast('Pengeluaran disimpan');
                route();
            } catch (e) {}
        }

        function toggleAcct(e) {
            e.stopPropagation();
            $('acct').classList.toggle('hidden');
            icons();
        }
        document.addEventListener('click', e => {
            const a = $('acct');
            if (a && !a.contains(e.target)) a.classList.add('hidden');
        });

        /* ===== Printer thermal Bluetooth (ESC/POS via Web Bluetooth) ===== */
        const SET = Object.assign({
            toko: 'AGEN BRILINK',
            alamat: '',
            footer: 'Terima kasih',
            lebar: 32,
            auto: false
        }, JSON.parse(localStorage.setting || '{}'));
        const BT = {
            dev: null,
            ch: null,
            chunk: 100
        };
        const BT_SVC = ['000018f0-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '0000fff0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2'];
        const btOn = () => !!(BT.ch && BT.dev && BT.dev.gatt.connected);

        function paintPrinter() {
            const e = $('btst');
            if (e) e.innerHTML = btOn() ? `<span class="text-emerald-500 font-bold">Terhubung:</span> ${escH(BT.dev.name)}` : 'Belum terhubung' + (localStorage.btName ? ` (terakhir: ${escH(localStorage.btName)})` : '');
        }
        async function btConnect(pick) {
            if (!navigator.bluetooth) throw new Error('Browser tidak mendukung Bluetooth. Pakai Chrome/Edge (Android atau komputer).');
            if (!BT.dev || pick) {
                BT.dev = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: BT_SVC
                });
                BT.dev.addEventListener('gattserverdisconnected', () => {
                    BT.ch = null;
                    paintPrinter();
                    toast('Printer terputus', false);
                });
            }
            BT.ch = null;
            const srv = await BT.dev.gatt.connect();
            for (const sv of await srv.getPrimaryServices()) {
                const w = (await sv.getCharacteristics()).find(c => c.properties.write || c.properties.writeWithoutResponse);
                if (w) {
                    BT.ch = w;
                    break;
                }
            }
            if (!BT.ch) throw new Error('Printer ini tidak dikenali (tidak ada jalur tulis data). Coba printer ESC/POS BLE lain.');
            localStorage.btName = BT.dev.name || 'Printer';
            return BT.dev.name || 'Printer';
        }
        async function btSend(bytes) {
            if (!btOn()) await btConnect(false);
            for (let n = BT.chunk, i = 0; i < bytes.length;) {
                try {
                    BT.ch.properties.writeWithoutResponse ? await BT.ch.writeValueWithoutResponse(bytes.slice(i, i + n)) : await BT.ch.writeValue(bytes.slice(i, i + n));
                    i += n;
                } catch (e) {
                    if (n > 20) {
                        n = BT.chunk = 20;
                        continue;
                    }
                    throw e;
                }
                await new Promise(r => setTimeout(r, 20));
            }
        }
        const enc = x => Array.from(String(x ?? '').normalize('NFD').replace(/[^\x20-\x7E]/g, ''), c => c.charCodeAt(0));

        function escpos(t) {
            const W = Number(SET.lebar) || 32,
                B = [],
                txt = x => B.push(...enc(x), 10),
                line = () => txt('-'.repeat(W));
            const row = (a, b) => {
                a = String(a);
                b = String(b);
                const l = a.slice(0, Math.max(1, W - b.length - 1));
                txt(l + ' '.repeat(Math.max(1, W - l.length - b.length)) + b);
            };
            B.push(27, 64, 27, 97, 1, 27, 69, 1);
            txt(SET.toko);
            B.push(27, 69, 0);
            if (SET.alamat) txt(SET.alamat);
            B.push(27, 97, 0);
            line();
            txt(t.tanggal + ' ' + t.waktu);
            txt('No: ' + t.id);
            row('Jenis', t.jenis_transaksi);
            row('Pelanggan', t.pelanggan);
            if (t.bank_tujuan) row('Bank', t.bank_tujuan);
            if (t.rekening_tujuan) row('Rek/Tujuan', t.rekening_tujuan);
            if (t.no_referensi) row('No Ref', t.no_referensi);
            line();
            row('Nominal', rp(t.nominal));
            row('Biaya admin', rp(t.biaya_admin));
            B.push(27, 69, 1);
            row('TOTAL', rp(Number(t.nominal) + Number(t.biaya_admin)));
            B.push(27, 69, 0);
            line();
            txt('Operator: ' + t.operator);
            B.push(27, 97, 1);
            txt(SET.footer);
            B.push(10, 10, 10, 29, 86, 66, 0);
            return new Uint8Array(B);
        }

            });
            doc.setFontSize(fs);
            doc.text(`${S.user.nama} (${S.user.role})`, x + 25, y + 19, {
                align: 'center'
            });
            doc.save(`laporan-${val('rd')}_${val('rs')}.pdf`);
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
        ['lu', 'lp'].forEach(i => $(i).addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        }));
        addEventListener('offline', () => toast('Tidak ada koneksi internet', false));
        addEventListener('online', () => {
            toast('Koneksi kembali');
            syncQueue();
        });
        boot();
        syncQueue();
    </script>
</body>

</html>
