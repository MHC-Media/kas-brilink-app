<style>
:root{color-scheme:light}.dark{color-scheme:dark}
html{-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(900px 400px at 85% -10%,rgba(14,165,233,.14),transparent),radial-gradient(700px 400px at -10% 110%,rgba(243,112,33,.10),transparent),#f1f5f9;transition:background .3s;overscroll-behavior-y:none}
.dark body{background:radial-gradient(900px 400px at 85% -10%,rgba(14,165,233,.16),transparent),radial-gradient(700px 400px at -10% 110%,rgba(243,112,33,.09),transparent),#0b1220}
.glass{background:rgba(255,255,255,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(148,163,184,.25);box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -14px rgba(15,23,42,.18)}
.dark .glass{background:rgba(30,41,59,.62);border-color:rgba(148,163,184,.16);box-shadow:0 12px 28px -14px rgba(0,0,0,.6)}
.inp{width:100%;border-radius:.75rem;border:1px solid #cbd5e1;padding:.65rem .8rem;background:rgba(255,255,255,.6);transition:.15s;font-size:16px}.dark .inp{border-color:#475569;background:rgba(15,23,42,.5)}
.inp:focus{outline:none;border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.25)}.dark .inp option{background:#1e293b}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border-radius:.75rem;padding:.6rem 1rem;font-weight:700;background:linear-gradient(135deg,#00529C,#0a74d4);color:#fff;box-shadow:0 6px 16px -8px #00529C;transition:.15s;min-height:44px}.btn:active{transform:scale(.97)}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.4;pointer-events:none}
.btn2{background:#e2e8f0;color:#0f172a;box-shadow:none}.dark .btn2{background:#334155;color:#e2e8f0}
.btn-ok{background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 6px 16px -8px #059669}.btn-no{background:linear-gradient(135deg,#e11d48,#f43f5e);box-shadow:0 6px 16px -8px #e11d48}.btn-or{background:linear-gradient(135deg,#F37021,#fb923c);box-shadow:0 6px 16px -8px #F37021}
.icon-btn{width:2.5rem;height:2.5rem;border-radius:.75rem;display:grid;place-items:center;transition:.15s}.icon-btn:hover{background:rgba(148,163,184,.2)}
th{font-weight:600;padding:.75rem 0;white-space:nowrap}tbody td{padding:.7rem 0}tbody tr:hover{background:rgba(14,165,233,.07)}
.dark ::-webkit-calendar-picker-indicator{filter:invert(.8)}
.pill{border:1px solid #cbd5e1;border-radius:.9rem;padding:.6rem .3rem;font-weight:600;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;transition:.15s;background:rgba(255,255,255,.5);min-height:64px;justify-content:center;text-align:center;line-height:1.15}
.dark .pill{border-color:#475569;background:rgba(15,23,42,.4)}.pill:active{transform:scale(.95)}
.pill.on{background:#00529C;border-color:#00529C;color:#fff;box-shadow:0 6px 16px -8px #00529C}
.chip{border:1px solid #cbd5e1;border-radius:999px;padding:.3rem .75rem;font-size:.8rem;font-weight:600;background:rgba(255,255,255,.5)}.dark .chip{border-color:#475569;background:rgba(15,23,42,.4)}.chip:active{transform:scale(.94)}.chip.on{background:#F37021;color:#fff;border-color:#F37021}
.badge{display:inline-block;border-radius:999px;padding:.1rem .55rem;font-size:.72rem;font-weight:700}
.nb{position:absolute;top:2px;right:6px;min-width:18px;height:18px;border-radius:9px;background:#F37021;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;animation:pop .3s}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;padding-bottom:env(safe-area-inset-bottom)}
.bnav a,.bnav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem 0 .4rem;font-size:.68rem;font-weight:600;color:#64748b;transition:.15s}
.bnav .on{color:#00529C}.dark .bnav .on{color:#38bdf8}.bnav .on span.ic{background:rgba(0,82,156,.12)}.dark .bnav .on span.ic{background:rgba(56,189,248,.15)}
.bnav span.ic{width:3.2rem;height:1.9rem;border-radius:1rem;display:grid;place-items:center;transition:.2s}
.hd{padding-top:env(safe-area-inset-top)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping2{0%{box-shadow:0 0 0 0 rgba(243,112,33,.55)}100%{box-shadow:0 0 0 22px rgba(243,112,33,0)}}
@keyframes dot{0%,80%,100%{transform:scale(.5);opacity:.35}40%{transform:scale(1);opacity:1}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{animation:rise .25s ease both}
.ldr{position:relative;width:88px;height:88px}.ldr i{position:absolute;inset:0;border-radius:50%;border:4px solid transparent;border-top-color:#F37021;border-right-color:#38bdf8;animation:spin .9s linear infinite}
.ldr i+i{inset:11px;border-top-color:#fff;border-right-color:transparent;border-left-color:#38bdf8;animation-duration:1.4s;animation-direction:reverse}
.ldr b{position:absolute;inset:23px;border-radius:14px;background:#fff;display:grid;place-items:center;animation:pop .6s both}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:currentColor;animation:dot 1.2s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.sk{background:linear-gradient(90deg,rgba(148,163,184,.14) 25%,rgba(148,163,184,.3) 50%,rgba(148,163,184,.14) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:1rem}
#spin{overflow:hidden}#spin::after{content:"";display:block;height:100%;width:40%;background:#fff;opacity:.8;animation:bar 1s ease-in-out infinite}
.wait{animation:ping2 1.4s infinite}
.chk{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .15s forwards}
.kode{font-size:2.6rem;font-weight:800;letter-spacing:.35rem;font-variant-numeric:tabular-nums}
.sw{width:44px;height:26px;border-radius:13px;background:#94a3b8;position:relative;transition:.2s;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
input:checked+.sw{background:#10b981}input:checked+.sw::after{left:21px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media print{aside,header,.noprint,.bnav{display:none!important}}
@media (max-width:767px){main{padding-bottom:6.5rem}.md-only{display:none}}
</style>

<body class="text-slate-800 dark:text-slate-100 font-sans antialiased">

<!-- SPLASH / LOADER -->
<div id="splash" class="fixed inset-0 z-[60] grid place-items-center bg-gradient-to-br from-bri via-sky-700 to-slate-900 text-white transition-opacity duration-300">
  <div class="flex flex-col items-center gap-5"><div class="ldr"><i></i><i></i><b><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#F37021" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 5l7 7-7 7"/></svg></b></div>
  <div class="text-xl font-bold tracking-wide">Kas <span class="text-oren">BRILink</span></div><div id="splmsg" class="text-sm opacity-80">Memuat aplikasi<span class="dots ml-1"><span></span><span></span><span></span></span></div></div>
</div>
<div id="busy" class="fixed inset-0 z-[55] hidden place-items-center bg-black/50 backdrop-blur-sm"><div class="glass rounded-3xl p-7 flex flex-col items-center gap-4"><div class="ldr"><i></i><i></i><b><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#F37021" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 5l7 7-7 7"/></svg></b></div><div id="busymsg" class="text-sm font-bold"></div></div></div>

<!-- LOGIN -->
<section id="login" class="relative min-h-screen hidden items-center justify-center p-4 bg-gradient-to-br from-bri via-sky-700 to-slate-900"><button class="themeBtn icon-btn absolute top-4 right-4 text-white" onclick="toggleTheme()" aria-label="Ganti tema" style="top:calc(1rem + env(safe-area-inset-top))"></button>
  <div class="glass w-full max-w-sm rounded-3xl p-8 shadow-xl fade">
    <img src="assets/logo.png" alt="BRILink" class="h-12 mb-4" onerror="this.outerHTML=LOGO_SVG"><h1 class="text-2xl font-bold text-bri dark:text-white">Kas BRILink</h1>
    <p class="text-sm text-slate-500 mb-6">Masuk sebagai admin atau kasir.</p>
    <input id="lu" class="inp mb-3" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off">
    <div class="relative mb-4"><input id="lp" type="password" class="inp pr-11" placeholder="Password" autocomplete="current-password"><button type="button" class="absolute right-1 top-1 icon-btn text-slate-500" onclick="const i=$('lp');i.type=i.type==='password'?'text':'password'" aria-label="Lihat password"><i data-lucide="eye" class="w-5"></i></button></div>
    <button id="lbtn" class="btn w-full" onclick="doLogin()"><i data-lucide="log-in" class="w-4"></i>Masuk</button>
    <p class="text-center text-xs text-slate-500 mt-6">MHC Media • ©2026</p>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden min-h-screen">
  <div id="scrim" class="fixed inset-0 z-20 bg-black/40 hidden md:hidden" onclick="menu(false)"></div>
  <aside id="side" class="fixed inset-y-0 left-0 z-30 w-64 -translate-x-full md:translate-x-0 transition-transform glass border-r border-slate-200 dark:border-slate-700 p-4 flex flex-col" style="padding-top:calc(1rem + env(safe-area-inset-top))">
    <div class="flex items-center gap-2 text-xl font-bold text-bri dark:text-white mb-6 px-2"><span class="w-9 h-9 rounded-xl bg-bri text-white grid place-items-center"><i data-lucide="landmark" class="w-5"></i></span>Kas BRILink</div>
    <nav id="nav" class="space-y-1 flex-1 overflow-y-auto"></nav>
    <button onclick="doLogout()" class="flex items-center gap-3 px-3 py-3 rounded-xl text-red-600 hover:bg-red-500/10"><i data-lucide="log-out"></i>Keluar</button>
  </aside>
  <div class="md:ml-64">
    <header class="sticky top-0 z-20 glass hd flex items-center gap-2 px-4 pb-3 pt-3 border-b border-slate-200 dark:border-slate-700">
      <button class="md:hidden icon-btn -ml-2" onclick="menu(true)" aria-label="Menu"><i data-lucide="menu"></i></button>
      <h2 id="title" class="font-bold flex-1 truncate"></h2>
      <span id="offl" class="hidden badge bg-rose-500/15 text-rose-500">Offline</span>
      <button id="who" onclick="pwForm()" title="Ubah password" class="text-sm text-slate-500 hover:text-bri flex items-center gap-1 max-w-[9rem] md:max-w-none truncate"></button>
      <button class="themeBtn icon-btn" onclick="toggleTheme()" aria-label="Ganti tema"></button>
    </header>
    <main id="view" class="p-4 max-w-6xl mx-auto"></main>
    <footer class="text-center text-xs text-slate-500 py-6 noprint hidden md:block">MHC Media • ©2026</footer>
  </div>
  <nav id="bnav" class="bnav md:hidden glass border-t border-slate-200 dark:border-slate-700 flex"></nav>
</div>

<div id="modal" class="fixed inset-0 z-40 hidden items-end md:items-center justify-center bg-black/50 md:p-4" onclick="if(event.target===this&&!LOCKM)closeModal()"><div id="mbody" class="bg-white dark:bg-slate-800 rounded-t-3xl md:rounded-2xl p-5 md:p-6 w-full max-w-md max-h-[92vh] overflow-auto fade" style="padding-bottom:calc(1.25rem + env(safe-area-inset-bottom))"></div></div>
<div id="toast" class="fixed z-50 space-y-2 left-4 right-4 md:left-auto md:right-4 md:w-80" style="bottom:calc(5.5rem + env(safe-area-inset-bottom))"></div>
<div id="spin" class="fixed top-0 inset-x-0 h-1 bg-oren hidden z-[70]"></div>

<script>
/* ===== Konfigurasi: tempel URL Web App Apps Script di sini ===== */
const LOGO_SVG = '<svg viewBox="0 0 190 48" class="h-12 mb-4 text-bri dark:text-white" role="img" aria-label="BRILink"><rect y="2" width="44" height="44" rx="12" fill="#00529C"/><path d="M12 24h20M26 15l9 9-9 9" stroke="#F37021" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="35" font-family="Plus Jakarta Sans,sans-serif" font-weight="800" font-size="30" fill="currentColor">BRI</text><text x="106" y="35" font-family="Plus Jakarta Sans,sans-serif" font-weight="800" font-size="30" fill="#F37021">Link</text></svg>';
const API_URL = 'https://script.google.com/macros/s/AKfycbzhJwiVrDXYcRVxr7Q8vD3AkI3WpkO38mnkKrGxUB4vfFsE6b_8uJ_BWm5D9LTppQGtqQ/exec';
const IDLE_MS = 30 * 60000;

/* ===== util dasar ===== */
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const today = () => new Date().toLocaleDateString('sv-SE');
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.toLocaleDateString('sv-SE'); };
const escH = x => String(x ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sumK = (a, k) => a.reduce((t, x) => t + Number(x[k] || 0), 0);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
const val = id => $(id).value;
const N = id => Number(String($(id).value || '').replace(/\D/g, '')) || 0;
const fmtN = v => { const d = String(v).replace(/\D/g, ''); return d ? Number(d).toLocaleString('id-ID') : ''; };
const mi = el => { el.value = fmtN(el.value); };
const S = { token: localStorage.token, user: JSON.parse(localStorage.user || 'null'), last: Number(localStorage.last) || Date.now(), me: null, verif: true, pending: 0 };
const icons = () => { try { window.lucide && lucide.createIcons(); } catch (e) {} };
function toast(m, ok = true) {
  const d = document.createElement('div');
  d.className = 'px-4 py-3 rounded-xl text-white shadow-lg fade ' + (ok ? 'bg-emerald-600' : 'bg-red-600'); d.textContent = m;
  $('toast').append(d); setTimeout(() => d.remove(), 3800);
}
function splash(on, msg) { const s = $('splash'); if (msg) $('splmsg').firstChild.textContent = msg; if (on) { s.style.display = 'grid'; s.style.opacity = 1; } else { s.style.opacity = 0; setTimeout(() => s.style.display = 'none', 300); } }
let BUSYN = 0;
function busy(msg) { const b = $('busy'); if (msg) { BUSYN++; $('busymsg').textContent = msg; b.style.display = 'grid'; } else if (--BUSYN <= 0) { BUSYN = 0; b.style.display = 'none'; } }
const skel = () => `<div class="fade grid grid-cols-2 lg:grid-cols-4 gap-3"><div class="sk h-20"></div><div class="sk h-20"></div><div class="sk h-20"></div><div class="sk h-20"></div></div><div class="sk h-40 mt-3"></div><div class="sk h-24 mt-3"></div>`;
const stBadge = s => ({ Menunggu: 'bg-amber-500/15 text-amber-600', Disetujui: 'bg-emerald-500/15 text-emerald-600', Ditolak: 'bg-rose-500/15 text-rose-600', Dibatalkan: 'bg-slate-500/15 text-slate-500' }[s || 'Disetujui'] || '');
const badge = s => `<span class="badge ${stBadge(s)}">${escH(s || 'Disetujui')}</span>`;

/* ===== services/api.js (retry + timeout + idempotent + cache baca) ===== */
const READ = { getDashboard: 20, getTransactions: 15, getExpenses: 30, getReports: 30, getUsers: 30 }, CACHE = new Map();
let SP = 0;
const spinOn = () => { SP++; $('spin').classList.remove('hidden'); }, spinOff = () => { if (--SP <= 0) { SP = 0; $('spin').classList.add('hidden'); } };
async function api(action, payload = {}, tries = 2, quiet = false) {
  if (API_URL.startsWith('GANTI')) { toast('API_URL belum diisi di index.html', false); throw new Error('API_URL belum diisi'); }
  const ttl = READ[action], key = action + JSON.stringify(payload), hit = ttl && CACHE.get(key);
  if (hit && Date.now() - hit.t < ttl * 1000) return JSON.parse(hit.v);
  const d = await apiRaw(action, payload, tries, quiet);
  if (ttl && d !== undefined) CACHE.set(key, { t: Date.now(), v: JSON.stringify(d) }); else if (!/^get|^me$|^logError$/.test(action)) CACHE.clear();
  return d;
}
async function apiRaw(action, payload, tries, quiet) {
  spinOn();
  try {
    for (let i = 0; i < tries; i++) {
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 28000);
      try {
        const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, token: S.token, payload }), signal: ctl.signal }); // text/plain: tanpa preflight CORS
        clearTimeout(to);
        let j; try { j = await r.json(); } catch (x) { throw new Error('Respons server tidak valid. Periksa deploy Apps Script.'); }
        if (!j.success) {
          if (j.data && j.data.expired) { logoutLocal(); return; }
          if (j.data && j.data.must_change) pwForm(true);
          throw Object.assign(new Error(j.message), { app: true });
        }
        S.last = Date.now(); localStorage.last = S.last; return j.data;
      } catch (e) {
        clearTimeout(to);
        if (e.app || i === tries - 1) throw e.name === 'AbortError' ? new Error('Server lambat merespons, coba lagi') : e;
        await sleep(600 * (i + 1));
      }
    }
  } catch (e) { if (!quiet) toast(e.message || 'Gagal terhubung ke server', false); throw e; }
  finally { spinOff(); }
}

/* ===== services/auth.js ===== */
let LOGGING = false;
async function doLogin() {
  if (LOGGING) return; if (!val('lu').trim() || !val('lp')) return toast('Isi username dan password', false);
  if (!navigator.onLine) return toast('Tidak ada koneksi internet', false);
  LOGGING = true; $('lbtn').disabled = true; busy('Memeriksa akun');
  try {
    const d = await api('login', { username: val('lu'), password: val('lp') }, 1);
    S.token = localStorage.token = d.token; S.user = d.user; localStorage.user = JSON.stringify(d.user); S.last = Date.now(); localStorage.last = S.last;
    $('lp').value = ''; boot(); if (d.must_change) pwForm(true);
  } catch (e) {} finally { LOGGING = false; $('lbtn').disabled = false; busy(); $('lp').value = ''; }
}
function logoutLocal() { CACHE.clear(); ['token', 'user', 'last'].forEach(k => localStorage.removeItem(k)); S.token = null; location.hash = ''; location.reload(); }
async function doLogout() { try { await api('logout', {}, 1, true); } catch (e) {} logoutLocal(); }
setInterval(() => { if (S.token && Date.now() - S.last > IDLE_MS) { toast('Logout otomatis: tidak aktif', false); setTimeout(logoutLocal, 600); } }, 30000);
['click', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, () => { if (S.token) { S.last = Date.now(); localStorage.last = S.last; } }, { passive: true }));

/* ===== components/modal.js ===== */
let LOCKM = false;
function openModal(html, lock) { LOCKM = !!lock; $('mbody').innerHTML = html; $('modal').classList.replace('hidden', 'flex'); icons(); }
function closeModal() { LOCKM = false; WAIT = null; $('modal').classList.replace('flex', 'hidden'); }
const LIB = { chart: 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js', xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', atable: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js', barcode: 'https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js' }, LOADED = {};
const loadLib = k => LOADED[k] = LOADED[k] || new Promise((ok, no) => { const e = document.createElement('script'); e.src = LIB[k]; e.onload = ok; e.onerror = () => { delete LOADED[k]; no(new Error('Gagal memuat pustaka ' + k + ', periksa koneksi')); }; document.head.appendChild(e); });
function menu(on) { $('side').classList.toggle('-translate-x-full', !on); $('scrim').classList.toggle('hidden', !on); }

/* ===== Navigasi ===== */
const PAGES = [
  ['dashboard', 'Dashboard', 'home', 'Admin'], ['dashboard', 'Beranda', 'home', 'Kasir'],
  ['kasir', 'Transaksi Baru', 'circle-plus', 'Kasir'],
  ['kas', 'Kas Kasir', 'wallet-cards', 'Admin'],
  ['transaksi', 'Transaksi', 'credit-card', 'Admin'], ['transaksi', 'Riwayat', 'history', 'Kasir'],

/* ===== Form transaksi (cepat) ===== */
const ADMCH = [2500, 3000, 5000, 6500, 10000, 15000], NOMCH = [50000, 100000, 200000, 500000, 1000000], METS = ['Tunai', 'Transfer', 'QRIS', 'Saldo'];
const lastAdm = j => JSON.parse(localStorage.adm || '{}')[j];
let ADMDIRTY = false;
function trxFormHTML(t = {}, inline = false) {
  const jenis = t.jenis_transaksi || localStorage.lastJenis || 'Transfer', met = t.metode_bayar || 'Tunai', isA = S.user.role === 'Admin';
  ADMDIRTY = !!t.id;

  return `<div class="space-y-3">
    ${inline ? '' : `<h3 class="font-bold text-lg">${t.id ? 'Edit' : 'Tambah'} transaksi</h3>`}

    <div><label class="text-xs text-slate-500">Nominal</label><div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 font-bold text-slate-400">Rp</span><input id="f_nom" inputmode="numeric" class="inp !pl-10 !text-2xl !font-bold" placeholder="0" value="${fmtN(t.nominal || '')}" oninput="mi(this);calc()" onkeydown="if(event.key==='Enter')$('f_adm').focus()"></div>
      <div class="flex gap-1.5 mt-2 overflow-x-auto pb-1">${NOMCH.map(n => `<button type="button" class="chip shrink-0" onclick="$('f_nom').value=fmtN(${n});calc()">${n >= 1e6 ? n / 1e6 + ' jt' : n / 1000 + ' rb'}</button>`).join('')}</div></div>
    <div><label class="text-xs text-slate-500">Biaya admin</label><div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 font-bold text-slate-400">Rp</span><input id="f_adm" inputmode="numeric" class="inp !pl-10 !text-lg !font-bold" placeholder="0" value="${fmtN(adm)}" oninput="mi(this);ADMDIRTY=true;calc()" onkeydown="if(event.key==='Enter')saveTrx('${escH(t.id || '')}')"></div>
      <div id="admch" class="flex gap-1.5 mt-2 overflow-x-auto pb-1"></div></div>
    <input id="f_met" type="hidden" value="${escH(met)}"><div class="flex gap-1.5 flex-wrap">${METS.map(m => `<button type="button" class="chip ${m === met ? 'on' : ''}" onclick="pick('f_met','${m}',this)">${m}</button>`).join('')}</div>
    <p class="text-xs text-slate-500 -mt-1">Tunai = uang lewat laci. Transfer / QRIS / Saldo = uang lewat saldo rekening.</p><input id="f_pel" class="inp" placeholder="Nama pelanggan (opsional)" maxlength="60" value="${escH(t.pelanggan && t.pelanggan !== '-' ? t.pelanggan : '')}">
    <details ${t.id ? 'open' : ''}><summary class="text-sm text-slate-500 cursor-pointer py-1">Opsi lanjutan</summary><div class="space-y-2 mt-2"><input id="f_ops" inputmode="numeric" class="inp" placeholder="Biaya operasional (opsional)" oninput="mi(this);calc()" value="${t.id ? fmtN(Number(t.biaya_admin) - Number(t.laba)) : ''}"><input id="f_ket" class="inp" placeholder="Keterangan" maxlength="150" value="${escH(t.keterangan || '')}"></div></details>
    <div class="grid grid-cols-2 gap-2"><div class="rounded-2xl bg-emerald-500/10 p-3"><div class="text-xs text-slate-500">Kas tunai</div><div id="f_ft" class="font-bold text-lg">Rp 0</div></div><div class="rounded-2xl bg-sky-500/10 p-3"><div class="text-xs text-slate-500">Saldo rekening</div><div id="f_fr" class="font-bold text-lg">Rp 0</div></div></div>
    <div class="rounded-2xl bg-slate-500/10 p-3 flex justify-between text-sm"><div>Total bayar<div id="f_tot" class="font-bold text-lg">Rp 0</div></div><div class="text-right">Laba<div id="f_laba" class="font-bold text-lg text-emerald-600">Rp 0</div></div></div>
    <div class="flex gap-2">${inline ? '' : '<button class="btn btn2" onclick="closeModal()">Batal</button>'}<button id="f_save" class="btn btn-or flex-1 !py-3.5 text-base" onclick="saveTrx('${escH(t.id || '')}')"><i data-lucide="check" class="w-5"></i>Simpan transaksi</button></div></div>`;
}
function admChips() {
  const j = val('f_jenis'), la = lastAdm(j), list = [...new Set([la, ...ADMCH].filter(Boolean))].slice(0, 6);
  $('admch').innerHTML = list.map(n => `<button type="button" class="chip shrink-0 ${n === la ? 'on' : ''}" onclick="$('f_adm').value=fmtN(${n});ADMDIRTY=true;calc()">${n === la ? '★ ' : ''}${n.toLocaleString('id-ID')}</button>`).join('');
}
function pick(id, v, el) { $(id).value = v; [...el.parentNode.children].forEach(b => b.classList.toggle('on', b === el)); if (id === 'f_met') calc(); if (id === 'f_jenis') { if (!ADMDIRTY) { $('f_adm').value = fmtN(lastAdm(v) || ''); } admChips(); calc(); } }
function fx(j, m, nom, adm) { const cash = m === 'Tunai'; let t = 0, r = 0; if (j === 'Tarik Tunai') { t = -nom; r = nom; } else if (j === 'Setor Tunai') { t = nom; r = -nom; } else { r = -nom; if (cash) t += nom; else r += nom; } if (cash) t += adm; else r += adm; return { tunai: t, rek: r }; }
function setFx(id, v) { const e = $(id); e.textContent = sgn(v); e.className = 'font-bold text-lg ' + (v >= 0 ? 'text-emerald-600' : 'text-rose-600'); }
function calc() { if (!$('f_tot')) return; const nom = N('f_nom'), adm = N('f_adm'), f = fx(val('f_jenis'), val('f_met'), nom, adm); $('f_tot').textContent = rp(nom + adm); $('f_laba').textContent = rp(adm - N('f_ops')); setFx('f_ft', f.tunai); setFx('f_fr', f.rek); }
function trxForm(id) { const t = id ? TRX.get(id) : {}; openModal(trxFormHTML(t)); admChips(); calc(); }
new MutationObserver(() => { if ($('f_adm') && $('admch') && !$('admch').children.length) { admChips(); calc(); } }).observe(document.body, { childList: true, subtree: true });
let SAVING = false;
async function saveTrx(id) {
  if (SAVING) return; if (!N('f_nom')) return toast('Isi nominal transaksi', false);
  if (N('f_ops') > N('f_adm')) return toast('Biaya operasional melebihi biaya admin', false);
  if (!navigator.onLine) return toast('Tidak ada koneksi internet', false);
  SAVING = true; const b = $('f_save'); b && (b.disabled = true);
  const ref = id ? undefined : (window.REF = window.REF || uid());
  try {
    const r = await api(id ? 'updateTransaction' : 'addTransaction', { id, ref, tanggal: $('f_tgl') ? val('f_tgl') : undefined, jenis_transaksi: val('f_jenis'), pelanggan: val('f_pel'), nominal: N('f_nom'), biaya_admin: N('f_adm'), biaya_operasional: N('f_ops'), keterangan: val('f_ket'), metode_bayar: val('f_met') }, 2);
    window.REF = null; localStorage.lastJenis = r.jenis_transaksi; const m = JSON.parse(localStorage.adm || '{}'); m[r.jenis_transaksi] = r.biaya_admin; localStorage.adm = JSON.stringify(m);
    TRX.set(r.id, r); if (navigator.vibrate) navigator.vibrate(30);
    if (S.user.role === 'Kasir') { if (!id && S.me && S.me.shift) { S.me.shift.saldo_sistem += Number(r.kas_tunai); S.me.shift.saldo_sistem_rek += Number(r.kas_rek); } successModal(r); }
    else { closeModal(); toast('Transaksi disimpan'); route(); }
    if (!id && SET.auto) struk(r.id);
  } catch (e) { if (/belum dibuka/.test(e.message || '')) { S.me = null; closeModal(); show('kasir'); } } finally { SAVING = false; b && (b.disabled = false); }
}
function successModal(t) {
  openModal(`<div class="text-center"><div class="w-20 h-20 mx-auto rounded-full bg-emerald-500/15 grid place-items-center" style="animation:pop .4s"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="chk" d="M5 13l4 4L19 7"/></svg></div>

}

/* ===== Printer thermal Bluetooth (ESC/POS via Web Bluetooth) ===== */
const SET = Object.assign({ toko: 'AGEN BRILINK', alamat: '', footer: 'Terima kasih', lebar: 32, auto: false }, JSON.parse(localStorage.setting || '{}'));
const BT = { dev: null, ch: null, chunk: 100 };
const BT_SVC = ['000018f0-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '0000fff0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2'];
const btOn = () => !!(BT.ch && BT.dev && BT.dev.gatt.connected);
function paintPrinter() { const e = $('btst'); if (e) e.innerHTML = btOn() ? `<span class="text-emerald-500 font-bold">Terhubung:</span> ${escH(BT.dev.name)}` : 'Belum terhubung' + (localStorage.btName ? ` (terakhir: ${escH(localStorage.btName)})` : ''); }
async function btConnect(pick) {
  if (!navigator.bluetooth) throw new Error('Browser tidak mendukung Bluetooth. Pakai Chrome/Edge (Android atau komputer).');
  if (!BT.dev || pick) {
    BT.dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BT_SVC });
    BT.dev.addEventListener('gattserverdisconnected', () => { BT.ch = null; paintPrinter(); toast('Printer terputus', false); });
  }
  BT.ch = null;
  const srv = await BT.dev.gatt.connect();
  for (const sv of await srv.getPrimaryServices()) {
    const w = (await sv.getCharacteristics()).find(c => c.properties.write || c.properties.writeWithoutResponse);
    if (w) { BT.ch = w; break; }
  }
  if (!BT.ch) throw new Error('Printer ini tidak dikenali (tidak ada jalur tulis data). Coba printer ESC/POS BLE lain.');
  localStorage.btName = BT.dev.name || 'Printer'; return BT.dev.name || 'Printer';
}
async function btSend(bytes) {
  if (!btOn()) await btConnect(false);
  for (let n = BT.chunk, i = 0; i < bytes.length;) {
    try { BT.ch.properties.writeWithoutResponse ? await BT.ch.writeValueWithoutResponse(bytes.slice(i, i + n)) : await BT.ch.writeValue(bytes.slice(i, i + n)); i += n; }
    catch (e) { if (n > 20) { n = BT.chunk = 20; continue; } throw e; }
    await sleep(20);
  }
}
const enc = x => Array.from(String(x ?? '').normalize('NFD').replace(/[^\x20-\x7E]/g, ''), c => c.charCodeAt(0));
function escpos(t) {
  const W = Number(SET.lebar) || 32, B = [], txt = x => B.push(...enc(x), 10), line = () => txt('-'.repeat(W));
  const row = (a, b) => { a = String(a); b = String(b); const l = a.slice(0, Math.max(1, W - b.length - 1)); txt(l + ' '.repeat(Math.max(1, W - l.length - b.length)) + b); };
  B.push(27, 64, 27, 97, 1, 27, 69, 1); txt(SET.toko); B.push(27, 69, 0); if (SET.alamat) txt(SET.alamat);
  B.push(27, 97, 0); line(); txt(t.tanggal + ' ' + t.waktu); txt('No: ' + t.id); row('Jenis', t.jenis_transaksi); row('Pelanggan', t.pelanggan);
  line(); row('Nominal', rp(t.nominal)); row('Biaya admin', rp(t.biaya_admin));
  B.push(27, 69, 1); row('TOTAL', rp(Number(t.nominal) + Number(t.biaya_admin))); B.push(27, 69, 0);
  line(); txt('Kasir: ' + (t.kasir_nama || t.operator)); B.push(27, 97, 1); txt(SET.footer); B.push(10, 10, 10, 29, 86, 66, 0);
  return new Uint8Array(B);
}
async function struk(id) {
  const t = typeof id === 'string' ? TRX.get(id) : id; if (!t) return;
  
  if (navigator.bluetooth && (BT.dev || localStorage.btName)) {
    try { await btSend(escpos(t)); return toast('Struk dikirim ke printer'); }
    catch (e) { if (e.name === 'NotFoundError') return; toast('Printer gagal: ' + e.message + '. Memakai cetak browser.', false); }
  }
  const w = open('', '', 'width=320,height=480'); if (!w) return toast('Pop-up diblokir, izinkan pop-up untuk mencetak', false);
  w.document.write(`<pre style="font:12px monospace;width:58mm">${escH(SET.toko)}\n${escH(SET.alamat)}\n--------------------------------\n${escH(t.tanggal)} ${escH(t.waktu)}\nNo: ${escH(t.id)}\n${escH(t.jenis_transaksi)}\n${escH(t.pelanggan)}\nNominal : ${rp(t.nominal)}\nAdmin   : ${rp(t.biaya_admin)}\nTOTAL   : ${rp(Number(t.nominal) + Number(t.biaya_admin))}\nKasir   : ${escH(t.kasir_nama || t.operator)}\n--------------------------------\n${escH(SET.footer)}</pre>`);
  w.document.close(); w.print();
}

  const hr = {}; t.forEach(x => { const k = x.tanggal + '|' + x.operator; const o = hr[k] = hr[k] || { tgl: x.tanggal, nama: nm[x.operator] || x.operator, n: 0, nom: 0, adm: 0, laba: 0, tun: 0, rek: 0 }; o.n++; o.nom += Number(x.nominal); o.adm += Number(x.biaya_admin); o.laba += Number(x.laba); o.tun += Number(x.kas_tunai); o.rek += Number(x.kas_rek); });

async function pdfOut() {

    let y = M.top; const need = h => { if (y + h > 297 - M.bottom) { doc.addPage(); y = M.top; } };
    const line = (s, size = 11, bold = false, dy = 6) => { need(dy); doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.text(s, M.left, y); y += dy; };
    const tbl = (head, body, o = {}) => { doc.autoTable({ startY: y, margin: M, head: [head], body, foot: o.foot ? [o.foot] : undefined, styles: { font: 'helvetica', fontSize: o.fs || 8.5, cellPadding: 1.3 }, headStyles: { fillColor: [0, 82, 156] }, footStyles: { fillColor: [226, 232, 240], textColor: 0 }, columnStyles: o.cs || {} }); y = doc.lastAutoTable.finalY + 6; };

    line(judul() + ' Kas BRILink', 14, true, 7); line('Periode ' + periode(), 10, false, 8);
    tbl(['Keterangan', 'Nilai'], [['Total transaksi', RPT.totalTransaksi], ['Total nominal', rp(RPT.totalNominal)], ['Total laba', rp(RPT.totalLaba)], ['Total pengeluaran', rp(RPT.totalPengeluaran)], ['Saldo akhir (laba - pengeluaran)', rp(RPT.saldoAkhir)], ['Arus kas tunai', sgn(RPT.totalTunai)], ['Arus saldo rekening', sgn(RPT.totalRek)]]);
    line('Rekap per kasir', 11, true); tbl(['Kasir', 'Trx', 'Nominal', 'Laba', 'Arus tunai', 'Arus rek.'], m.ks.map(k => [k.nama, k.n, rp(k.nom), rp(k.laba), sgn(k.tun), sgn(k.rek)]), { cs: { 2: R, 3: R, 4: R, 5: R } });
    if (RPT.shifts.length) { line('Sesi kas tunai', 11, true); tbl(SESI_H, sesiT(RPT.shifts), { cs: { 2: R, 3: R, 4: R, 5: R } }); line('Sesi saldo rekening', 11, true); tbl(SESI_H, sesiR(RPT.shifts), { cs: { 2: R, 3: R, 4: R, 5: R } }); }
    m.ks.forEach(k => { need(20); line(`Kasir: ${k.nama} (@${k.u})`, 11, true); if (k.a.length) tbl(['Waktu', 'Jenis', 'Pelanggan', 'Nominal', 'Laba', 'Tunai', 'Rekening'], k.a.slice().sort((a, b) => (a.tanggal + a.waktu).localeCompare(b.tanggal + b.waktu)).map(t => [t.tanggal.slice(5) + ' ' + t.waktu, t.jenis_transaksi, t.pelanggan, rp(t.nominal), rp(t.laba), sgn(t.kas_tunai), sgn(t.kas_rek)]), { fs: 7.5, foot: ['Total', '', k.n + ' trx', rp(k.nom), rp(k.laba), sgn(k.tun), sgn(k.rek)], cs: { 3: R, 4: R, 5: R, 6: R } }); else line('Tidak ada transaksi.', 9, false, 8); });
    if (m.hari.length > 1) { line('Rekap harian per kasir', 11, true); tbl(['Tanggal', 'Kasir', 'Trx', 'Nominal', 'Laba', 'Tunai', 'Rek.'], m.hari.map(h => [h.tgl, h.nama, h.n, rp(h.nom), rp(h.laba), sgn(h.tun), sgn(h.rek)]), { fs: 7.5, cs: { 3: R, 4: R, 5: R, 6: R } }); }
    if (RPT.pengeluaran.length) { line('Pengeluaran', 11, true); tbl(['Tanggal', 'Kategori', 'Deskripsi', 'Nominal'], RPT.pengeluaran.map(e => [e.tanggal, e.kategori, e.deskripsi, rp(e.nominal)]), { cs: { 3: R } }); }
