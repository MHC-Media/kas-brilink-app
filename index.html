<html lang="id">

<link rel="manifest" href="manifest.json">

<script>document.documentElement.classList.toggle('dark',(localStorage.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark')</script>
<style>
:root{--bri:#00529C;--bri2:#0a74d4;--or:#F37021;--bg:#eef2f7;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--ok:#059669;--bad:#dc2626;--warn:#d97706;color-scheme:light}
.dark{--bg:#0b1220;--card:#152036;--tx:#e8eef8;--mut:#94a3b8;--bd:#25324a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);transition:background .3s}
h2,h3{margin:0}h3{font-size:14px;color:var(--mut);margin:18px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
small,.mut{color:var(--mut);font-size:12px}small{display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* layout */
#app{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(135deg,var(--bri),var(--bri2));color:#fff}
.top h2{flex:1;font-size:17px}.top .who{font-size:12px;opacity:.9;text-align:right;line-height:1.2}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:inherit;background:rgba(255,255,255,.15)}
main{max-width:980px;margin:0 auto;padding:14px}
.page{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px -12px rgba(0,0,0,.3)}
nav.bar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;color:var(--mut);font-size:11px;font-weight:600;text-decoration:none;position:relative;transition:.2s}
nav.bar a.on{color:var(--bri);background:rgba(0,82,156,.1)}.dark nav.bar a.on{color:#60a5fa;background:rgba(96,165,250,.12)}
nav.bar a .n{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;animation:pop .3s}
@media(min-width:900px){#app{padding-bottom:0;padding-left:88px}nav.bar{top:0;right:auto;width:88px;flex-direction:column;justify-content:flex-start;gap:6px;padding:80px 6px 0;border-top:0;border-right:1px solid var(--bd)}}
/* components */
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px}
.hero{border-radius:22px;padding:18px;color:#fff;margin-bottom:10px;background:linear-gradient(135deg,#00529C,#0ea5e9 70%,#F37021 160%);box-shadow:0 14px 26px -16px #00529C}
.hero b{display:block;font-size:30px;line-height:1.15;margin:2px 0 8px}.hero small{color:rgba(255,255,255,.8)}.hero .row{font-size:12px;opacity:.95;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px}.gap{gap:8px;flex-wrap:wrap;margin-top:10px}.grow{flex:1;min-width:0}.r{text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.grid3 b{font-size:13px}
@media(min-width:700px){.grid2{grid-template-columns:repeat(4,1fr)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
.kpi{display:flex;gap:10px;align-items:center;margin:0}.kpi .ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:rgba(14,165,233,.14);color:#0ea5e9}.kpi b{font-size:16px;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:11px 16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--bri),var(--bri2));box-shadow:0 8px 16px -10px var(--bri);transition:.15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;pointer-events:none}.btn.sec{background:var(--bd);color:var(--tx);box-shadow:none}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.sm{padding:8px 12px;font-size:13px}.btn.big{width:100%;padding:16px;font-size:17px;border-radius:18px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 5px}
.inp{width:100%;border-radius:14px;border:1.5px solid var(--bd);padding:12px 14px;background:var(--bg);color:var(--tx);font:inherit;transition:.15s}
.inp:focus{outline:0;border-color:var(--bri2);box-shadow:0 0 0 3px rgba(10,116,212,.2)}.inp.big{font-size:28px;font-weight:800;padding:14px;letter-spacing:.5px}.inp.code{font-size:20px;font-weight:800;letter-spacing:4px;text-transform:uppercase;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 13px;border-radius:12px;background:var(--bg);border:1.5px solid var(--bd);font-weight:600;font-size:13px;transition:.15s}.chip.on{background:var(--bri);border-color:var(--bri);color:#fff;transform:scale(1.03)}.chips.sm .chip{padding:6px 10px;font-size:12px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:var(--bd);color:var(--mut)}
.badge.ok{background:rgba(5,150,105,.15);color:var(--ok)}.badge.bad{background:rgba(220,38,38,.14);color:var(--bad)}.badge.warn{background:rgba(217,119,6,.16);color:var(--warn)}.badge.mut{background:var(--bd)}
.item{display:flex;gap:10px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;margin-bottom:8px;cursor:pointer;transition:.15s}.item:active{transform:scale(.985)}
.av{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--bri),var(--or));color:#fff;display:grid;place-items:center;font-weight:800}
.alert{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;margin-bottom:10px;text-decoration:none;color:#7c2d12;background:#ffedd5;border:1px solid #fdba74;animation:pulseb 1.8s infinite}.dark .alert{background:#3b2410;color:#fdba74;border-color:#9a5a1d}
@keyframes pulseb{50%{box-shadow:0 0 0 6px rgba(243,112,33,.18)}}
.bars{display:flex;gap:8px;align-items:flex-end;height:150px}.b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--mut);gap:3px}
.b i{display:block;width:100%;min-height:3px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#38bdf8,var(--bri));transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.sum{margin-top:12px;padding:12px;border-radius:14px;background:var(--bg);font-size:13px}.sum div{display:flex;justify-content:space-between;padding:2px 0}.sum .t{font-weight:800;font-size:15px;border-top:1px dashed var(--bd);margin-top:4px;padding-top:6px}
.sticky{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));padding:8px 0;background:linear-gradient(transparent,var(--bg) 40%)}
@media(min-width:900px){.sticky{bottom:0}}
.center{text-align:center;padding:24px 16px}.center p{margin:6px 0 14px}
.kode{font:800 38px/1.1 ui-monospace,Menlo,monospace;letter-spacing:8px;margin:10px 0 16px;padding:12px;border-radius:16px;background:var(--bg);border:2px dashed var(--bri2);color:var(--bri)}.dark .kode{color:#60a5fa}
.pulse{width:78px;height:78px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;color:var(--or);background:rgba(243,112,33,.14);position:relative}.pulse .ic{width:34px;height:34px}
.pulse:before,.pulse:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--or);animation:ring 1.8s infinite}.pulse:after{animation-delay:.9s}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}
.done{width:84px;height:84px;margin:0 auto 10px}.done circle{fill:none;stroke-width:4;stroke-dasharray:252;stroke-dashoffset:252;animation:dash .6s .05s forwards}.done path{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dash .4s .55s forwards}
.done.g{stroke:var(--ok)}.done.r{stroke:var(--bad)}@keyframes dash{to{stroke-dashoffset:0}}
/* loading */
.sk{border-radius:18px;margin-bottom:10px;background:linear-gradient(90deg,var(--bd) 25%,rgba(148,163,184,.12) 50%,var(--bd) 75%);background-size:200% 100%;animation:sh 1.2s infinite linear}@keyframes sh{to{background-position:-200% 0}}
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:99;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent,var(--or),#fbbf24,transparent);background-size:50% 100%;background-repeat:no-repeat;animation:slide 1s infinite linear}
#bar.on{opacity:1}@keyframes slide{from{background-position:-50% 0}to{background-position:150% 0}}
#busy{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(15,23,42,.35);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .2s}
#busy.on{opacity:1;pointer-events:auto;transition-delay:.25s}
.coin{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#7c3a0a;background:linear-gradient(135deg,#fde68a,#F37021);box-shadow:0 10px 24px -8px #F37021;animation:flip 1s infinite linear}@keyframes flip{to{transform:rotateY(360deg)}}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:18px;background:linear-gradient(160deg,#00529C,#0a74d4 60%,#0c3b6e);color:#fff;transition:opacity .4s,visibility .4s}
#splash.off{opacity:0;visibility:hidden}
.logo{width:92px;height:92px;border-radius:28px;background:#fff;display:grid;place-items:center;position:relative;animation:bob 1.6s ease-in-out infinite}.logo svg{width:52px;height:52px}
.logo:before{content:"";position:absolute;inset:-10px;border-radius:36px;border:3px solid transparent;border-top-color:var(--or);border-right-color:var(--or);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-6px)}}
.pg{width:140px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}.pg i{display:block;height:100%;width:40%;border-radius:9px;background:var(--or);animation:slide2 1.1s infinite ease-in-out}@keyframes slide2{from{margin-left:-40%}to{margin-left:100%}}
/* modal & toast */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,23,42,.5);opacity:0;pointer-events:none;transition:opacity .2s}
#modal.on{opacity:1;pointer-events:auto}#mbody{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .25s}#modal.on #mbody{transform:none}
@media(min-width:700px){#modal{align-items:center}#mbody{border-radius:24px}}
#toast{position:fixed;left:12px;right:12px;top:calc(60px + env(safe-area-inset-top));z-index:80;display:grid;gap:8px;justify-items:center;pointer-events:none}
#toast div{padding:10px 16px;border-radius:14px;color:#fff;font-weight:600;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);animation:in .25s;max-width:480px}
@keyframes pop{from{transform:scale(0)}}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#00529C,#0a74d4 60%,#0c3b6e)}
#login .card{width:100%;max-width:380px;border-radius:28px;padding:26px;animation:in .4s}
#offline{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:70;text-align:center;background:var(--bad);color:#fff;padding:6px;font-size:12px;font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t td{padding:6px 0;border-bottom:1px solid var(--bd);vertical-align:top}table.t td:last-child{text-align:right;font-weight:600}
@media print{.top,nav.bar,.noprint{display:none!important}}
</style>
</head>
<body>

<div id="splash"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#F37021" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h16M13 5l7 7-7 7"/></svg></div><b style="font-size:20px;letter-spacing:.5px">Kas BRILink</b><div class="pg"><i></i></div></div>
<div id="bar"></div>
<div id="busy"><div class="coin">Rp</div></div>

<section id="login" hidden>
  <div class="card">
    <div class="row" style="margin-bottom:6px"><div class="av" style="width:46px;height:46px;border-radius:16px"><svg class="ic" viewBox="0 0 24 24" style="stroke:#fff;stroke-width:3"><path d="M3 12h16M13 5l7 7-7 7"/></svg></div><div><h2 style="color:var(--bri)">Kas BRILink</h2><small>Masuk sebagai Admin atau Kasir</small></div></div>
    <label>Username</label><input id="lu" class="inp" autocomplete="username" autocapitalize="none" autocorrect="off" maxlength="40">
    <label>Password</label><input id="lp" type="password" class="inp" autocomplete="current-password" maxlength="100">
    <button class="btn big" style="margin-top:18px" onclick="doLogin()">Masuk</button>
    <p class="mut" style="text-align:center;margin:16px 0 0;font-size:12px">MHC Media • ©2026</p>
  </div>
</section>

<div id="app" hidden>
  <header class="top"><h2 id="title"></h2><div class="who" id="who"></div><button class="ib" onclick="refresh()" aria-label="Muat ulang" id="rf"></button><button class="ib themeBtn" onclick="toggleTheme()" aria-label="Tema"></button></header>
  <main id="view"></main>
  <nav class="bar" id="nav"></nav>
</div>
<div id="offline" hidden>Tidak ada koneksi internet</div>
<div id="modal" onclick="if(event.target===this&&!LOCKED)closeModal()"><div id="mbody"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ===== Konfigurasi: tempel URL Web App Apps Script di sini ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzhJwiVrDXYcRVxr7Q8vD3AkI3WpkO38mnkKrGxUB4vfFsE6b_8uJ_BWm5D9LTppQGtqQ/exec';

/* ===== Util ===== */
const $ = id => document.getElementById(id), sleep = ms => new Promise(r => setTimeout(r, ms));
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const today = () => new Date().toLocaleDateString('sv-SE');
const escH = x => String(x ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const val = id => $(id).value.trim(), numv = id => Number(String($(id).value).replace(/\D/g, '')) || 0;
const short = n => n >= 1e6 ? +(n / 1e6).toFixed(1) + 'jt' : n >= 1e3 ? Math.round(n / 1e3) + 'rb' : String(n);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
const JENIS = ['Transfer', 'Tarik Tunai', 'Setor Tunai', 'BRIVA', 'Pembayaran Tagihan', 'Top Up E-Wallet', 'Pulsa', 'Token PLN', 'Cicilan', 'QRIS', 'Lainnya'];
const METODE = ['Tunai', 'Transfer', 'QRIS', 'Saldo'], KAT = ['Listrik', 'Internet', 'Sewa', 'ATK', 'Operasional', 'Lainnya'];
const ST = { Menunggu: 'warn', Disetujui: 'ok', Ditolak: 'bad', Dibatalkan: 'mut' };
const opt = (a, s) => a.map(x => `<option ${x === s ? 'selected' : ''}>${escH(x)}</option>`).join('');
const delta = (j, m, n, a) => j === 'Tarik Tunai' ? -n + (m === 'Tunai' ? a : 0) : (m === 'Tunai' ? n + a : 0);
const IC = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', plus: '<path d="M12 5v14M5 12h14"/>', check: '<path d="M5 12l5 5L20 7"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 010 7M18 14.5c2 .7 3.5 2.5 3.5 5.5"/>',
  wallet: '<path d="M3 7a2 2 0 012-2h13v4"/><path d="M3 7v11a2 2 0 002 2h15V9H5a2 2 0 01-2-2z"/><circle cx="16.5" cy="14.5" r="1"/>',
  file: '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  grid: '<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
  out: '<path d="M9 4H5a2 2 0 00-2 2v12a2 2 0 002 2h4M16 8l4 4-4 4M20 12H9"/>', shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  printer: '<path d="M7 9V3h10v6M7 17H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2"/><rect x="7" y="14" width="10" height="7"/>',
  dl: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>', lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  set: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  bt: '<path d="M7 7l10 10-5 4V3l5 4L7 17"/>', trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', trend: '<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>', key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
  refresh: '<path d="M20 11a8 8 0 00-14-4L4 9M4 4v5h5M4 13a8 8 0 0014 4l2-2M20 20v-5h-5"/>', db: '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24">${IC[n] || ''}</svg>`;

/* ===== State & API ===== */
const SS = sessionStorage, S = { token: SS.token || null, user: JSON.parse(SS.user || 'null'), last: Date.now() };
const READ = { getHome: 15, getTransactions: 15, getShifts: 10, getExpenses: 30, getUsers: 60, getReports: 30 }, CACHE = new Map();
let PEND = 0, BUSY = false, LOCKED = false, PAGE = '', RID = 0;
const bar = on => { PEND += on ? 1 : -1; $('bar').classList.toggle('on', PEND > 0); };
function toast(m, ok = true) { const d = document.createElement('div'); d.style.background = ok ? 'var(--ok)' : 'var(--bad)'; d.textContent = m; $('toast').append(d); setTimeout(() => d.remove(), 3500); }
async function api(a, p = {}, o = {}) {
  if (API_URL.startsWith('GANTI')) { toast('API_URL belum diisi di index.html', false); throw Object.assign(new Error('API_URL belum diisi'), { shown: true }); }
  const ttl = READ[a], key = a + JSON.stringify(p);
  if (ttl && !o.fresh) { const h = CACHE.get(key); if (h && Date.now() - h.t < ttl * 1000) return JSON.parse(h.v); }
  const d = await call(a, p, o);
  if (ttl) CACHE.set(key, { t: Date.now(), v: JSON.stringify(d) }); else if (a.indexOf('get') !== 0) CACHE.clear();

async function call(a, p, o) {

        const j = await r.json();
        if (!j.success) { if (j.data && j.data.expired) { logoutLocal(); throw Object.assign(new Error(j.message), { app: true, quiet: true }); } throw Object.assign(new Error(j.message), { app: true }); }
        S.last = Date.now(); return j.data;

}

const SET = Object.assign({ toko: 'AGEN BRILINK', alamat: '', footer: 'Terima kasih', lebar: 32, auto: false }, JSON.parse(localStorage.setting || '{}'));
const BT = { dev: null, ch: null, chunk: 100 };
const BT_SVC = ['000018f0-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '0000fff0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2'];

function paintPrinter() { const e = $('btst'); if (e) e.innerHTML = btOn() ? `<b style="color:var(--ok)">Terhubung:</b> ${escH(BT.dev.name)}` : 'Belum terhubung' + (localStorage.btName ? ` (terakhir: ${escH(localStorage.btName)})` : ''); }
async function btConnect(pick) {
  if (!navigator.bluetooth) throw new Error('Browser tidak mendukung Bluetooth. Pakai Chrome/Edge.');
  if (!BT.dev || pick) { BT.dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BT_SVC }); BT.dev.addEventListener('gattserverdisconnected', () => { BT.ch = null; paintPrinter(); }); }

  if (!BT.ch) throw new Error('Printer tidak dikenali. Coba printer ESC/POS BLE lain.');

}
async function btSend(bytes) {

    catch (e) { if (n > 20) { n = BT.chunk = 20; continue; } throw e; }

}

  B.push(27, 64, 27, 97, 1, 27, 69, 1); txt(SET.toko); B.push(27, 69, 0); if (SET.alamat) txt(SET.alamat);
  B.push(27, 97, 0); line(); txt(t.tanggal + ' ' + t.waktu); txt('No: ' + t.id); if (t.kode) txt('Kode: ' + t.kode); row('Jenis', t.jenis_transaksi); row('Pelanggan', t.pelanggan);
  line(); row('Nominal', rp(t.nominal)); row('Biaya admin', rp(t.biaya_admin)); B.push(27, 69, 1); row('TOTAL', rp(Number(t.nominal) + Number(t.biaya_admin))); B.push(27, 69, 0);

const fname = ext => `laporan-${val('rt') === 'b' ? 'bulanan-' + RPT.dari.slice(0, 7) : val('rt') === 'h' ? 'harian-' + RPT.dari : RPT.dari + '_' + RPT.sampai}${RPT.kasir ? '-' + RPT.kasir : ''}.${ext}`;
async function pdfOut() {
  if (!RPT) return; try { await loadLib('jspdf'); await loadLib('atable'); await loadLib('barcode'); } catch (e) { return toast(e.message, false); }
  await act(async () => {
    const R = RPT, doc = new jspdf.jsPDF({ unit: 'mm', format: 'a4' }), M = { top: 30, left: 40, right: 30, bottom: 30 }, PW = 210, H = 297;
    const tbl = o => doc.autoTable(Object.assign({ margin: M, styles: { font: 'helvetica', fontSize: 8, cellPadding: 1.5 }, headStyles: { fillColor: [0, 82, 156] }, footStyles: { fillColor: [226, 232, 240], textColor: 0 } }, o));
    let y = M.top; const need = h => { if (y + h > H - M.bottom) { doc.addPage(); y = M.top; } }, head = t => { need(14); doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text(t, M.left, y); doc.setFont('helvetica', 'normal'); y += 3; };
    doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text('LAPORAN KAS BRILINK', M.left, y); doc.setFont('helvetica', 'normal'); doc.setFontSize(10); y += 6;
    doc.text(periodeTxt(), M.left, y); y += 5; doc.text(R.kasir ? 'Kasir: ' + R.kasirNama + ' (' + R.kasir + ')' : 'Semua kasir', M.left, y); y += 6;
    head('Ringkasan'); tbl({ startY: y, theme: 'plain', body: [['Transaksi disetujui', R.totalTransaksi], ['Total nominal', 'Rp ' + num(R.totalNominal)], ['Total biaya admin', 'Rp ' + num(R.totalAdmin)], ['Total laba', 'Rp ' + num(R.totalLaba)], ['Total pengeluaran', 'Rp ' + num(R.totalPengeluaran)], ['Saldo akhir', 'Rp ' + num(R.saldoAkhir)], ['Ditolak / Dibatalkan', R.ditolak + ' / ' + R.dibatalkan]], columnStyles: { 1: { halign: 'right' } } }); y = doc.lastAutoTable.finalY + 6;
    head('Rekap per kasir (Rp)'); const pk = R.perKasir, sm = k => pk.reduce((t, x) => t + (x[k] || 0), 0);
    tbl({ startY: y, styles: { fontSize: 7, cellPadding: 1.2 }, head: [['Kasir', 'Trx', 'Saldo Awal', 'Kas Masuk', 'Kas Keluar', 'Saldo Sistem', 'Laba', 'Selisih']], body: pk.map(k => [k.nama, k.trx, num(k.saldo_awal), num(k.kas_masuk), num(k.kas_keluar), num(k.saldo_sistem), num(k.laba), k.selisih === null ? '-' : num(k.selisih)]),
      foot: [['TOTAL', sm('trx'), num(sm('saldo_awal')), num(sm('kas_masuk')), num(sm('kas_keluar')), num(sm('saldo_sistem')), num(sm('laba')), '']], columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' }, 6: { halign: 'right' }, 7: { halign: 'right' } } }); y = doc.lastAutoTable.finalY + 6;
    if (R.dari !== R.sampai && R.harian.length) { head('Rekap harian (Rp)'); tbl({ startY: y, head: [['Tanggal', 'Trx', 'Nominal', 'Biaya Admin', 'Laba']], body: R.harian.map(h => [h.tanggal, h.trx, num(h.nominal), num(h.admin), num(h.laba)]), columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' } } }); y = doc.lastAutoTable.finalY + 6; }
    pk.forEach(k => {
      const rows = R.transaksi.filter(x => x.operator === k.username); if (!rows.length) return;
      head(`Detail kasir: ${k.nama} (${k.username})`); y += 2; doc.setFontSize(8); doc.text(`Saldo awal Rp ${num(k.saldo_awal)} | Kas masuk Rp ${num(k.kas_masuk)} | Kas keluar Rp ${num(k.kas_keluar)} | Saldo sistem Rp ${num(k.saldo_sistem)}${k.saldo_fisik !== null ? ' | Fisik Rp ' + num(k.saldo_fisik) : ''}`, M.left, y, { maxWidth: PW - M.left - M.right }); y += 5;
      tbl({ startY: y, styles: { fontSize: 7, cellPadding: 1.2 }, head: [['Tgl/Waktu', 'Kode', 'Jenis / Pelanggan', 'Nominal', 'Admin', 'Laba']], body: rows.map(t => [t.tanggal.slice(5) + ' ' + t.waktu, t.kode || '-', t.jenis_transaksi + ' / ' + t.pelanggan, num(t.nominal), num(t.biaya_admin), num(t.laba)]),
        foot: [['', '', `Subtotal (${rows.length} trx)`, num(k.nominal), num(k.admin), num(k.laba)]], columnStyles: { 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' } } }); y = doc.lastAutoTable.finalY + 6;
    });
    need(48); const code = sigCode(), x = PW - M.right - 60; doc.setFontSize(10); doc.text('Dicetak ' + new Date().toLocaleString('id-ID'), x + 30, y, { align: 'center' }); doc.text('Dibuat oleh,', x + 30, y + 5, { align: 'center' });
    doc.addImage(barcodeURL(code), 'PNG', x, y + 8, 60, 14); doc.setFontSize(8); doc.text(code, x + 30, y + 26, { align: 'center' }); doc.setFontSize(10); doc.text(`${S.user.nama} (${S.user.role})`, x + 30, y + 32, { align: 'center' });
    const n = doc.getNumberOfPages(); for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(8); doc.text(`Halaman ${i}/${n}`, PW - M.right, H - 15, { align: 'right' }); }
    doc.save(fname('pdf'));
  });
}
async function xlsxOut() {
  if (!RPT) return; try { await loadLib('xlsx'); } catch (e) { return toast(e.message, false); }
  const R = RPT, wb = XLSX.utils.book_new(), nm = s => s.replace(/[\\\/?*\[\]:]/g, '').slice(0, 31);
  const add = (name, aoa, w) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = (w || []).map(x => ({ wch: x })); Object.keys(ws).forEach(k => { if (k[0] !== '!' && ws[k].t === 'n') ws[k].z = '#,##0'; }); XLSX.utils.book_append_sheet(wb, ws, nm(name)); };
  const HEAD = ['Tanggal', 'Waktu', 'Kode', 'Kasir', 'Jenis', 'Pelanggan', 'Metode', 'Nominal', 'Biaya Admin', 'Laba', 'Kas Laci', 'Diverifikasi'], W = [12, 8, 9, 12, 20, 22, 10, 14, 12, 12, 12, 14];
  const row = t => [t.tanggal, t.waktu, t.kode || '-', t.operator, t.jenis_transaksi, t.pelanggan, t.metode_bayar, +t.nominal, +t.biaya_admin, +t.laba, +t.kas_delta || 0, t.verified_by || ''];
  add('Ringkasan', [['LAPORAN KAS BRILINK'], [periodeTxt()], [R.kasir ? 'Kasir: ' + R.kasirNama : 'Semua kasir'], [], ['Transaksi disetujui', R.totalTransaksi], ['Total nominal', R.totalNominal], ['Total biaya admin', R.totalAdmin], ['Total laba', R.totalLaba], ['Total pengeluaran', R.totalPengeluaran], ['Saldo akhir', R.saldoAkhir], ['Ditolak', R.ditolak], ['Dibatalkan', R.dibatalkan], [], ['Dicetak oleh', S.user.nama + ' (' + S.user.role + ')'], ['Waktu cetak', new Date().toLocaleString('id-ID')]], [26, 30]);
  const pk = R.perKasir, sm = k => pk.reduce((t, x) => t + (x[k] || 0), 0);
  add('Rekap Kasir', [['Kasir', 'Username', 'Shift', 'Saldo Awal', 'Trx', 'Nominal', 'Biaya Admin', 'Laba', 'Kas Masuk', 'Kas Keluar', 'Saldo Sistem', 'Saldo Fisik', 'Selisih', 'Ditolak', 'Dibatalkan'], ...pk.map(k => [k.nama, k.username, k.shift, k.saldo_awal, k.trx, k.nominal, k.admin, k.laba, k.kas_masuk, k.kas_keluar, k.saldo_sistem, k.saldo_fisik === null ? '-' : k.saldo_fisik, k.selisih === null ? '-' : k.selisih, k.ditolak, k.dibatalkan]),
    ['TOTAL', '', sm('shift'), sm('saldo_awal'), sm('trx'), sm('nominal'), sm('admin'), sm('laba'), sm('kas_masuk'), sm('kas_keluar'), sm('saldo_sistem'), '', '', sm('ditolak'), sm('dibatalkan')]], [18, 12, 7, 13, 6, 14, 12, 12, 13, 13, 13, 13, 11, 8, 10]);
  add('Rekap Harian', [['Tanggal', 'Transaksi', 'Nominal', 'Biaya Admin', 'Laba'], ...R.harian.map(h => [h.tanggal, h.trx, h.nominal, h.admin, h.laba]), ['TOTAL', R.totalTransaksi, R.totalNominal, R.totalAdmin, R.totalLaba]], [12, 10, 14, 13, 13]);
  add('Per Jenis', [['Jenis', 'Transaksi', 'Nominal', 'Laba'], ...R.jenis.map(j => [j.jenis, j.trx, j.nominal, j.laba])], [22, 10, 14, 13]);
  add('Semua Transaksi', [HEAD, ...R.transaksi.map(row)], W);
  pk.forEach(k => { const rows = R.transaksi.filter(x => x.operator === k.username); add('Kasir ' + k.username, [['Kasir', k.nama], ['Saldo awal', k.saldo_awal], ['Kas masuk', k.kas_masuk], ['Kas keluar', k.kas_keluar], ['Saldo sistem', k.saldo_sistem], ['Saldo fisik', k.saldo_fisik === null ? '-' : k.saldo_fisik], ['Selisih', k.selisih === null ? '-' : k.selisih], [], HEAD, ...rows.map(row), ['', '', '', '', '', '', 'Subtotal', k.nominal, k.admin, k.laba]], W); });

/* ===== Polling ringan: admin lihat antrean, kasir lihat hasil verifikasi ===== */
let LASTP = 0;
function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .08; o.start(); o.stop(a.currentTime + .15); } catch (e) {} }
setInterval(async () => {
  if (!S.token || document.hidden || !navigator.onLine || BUSY) return;
  try {
    if (S.user.role === 'Admin') {
      const d = await api('getPending', {}, { silent: true, tries: 1, fresh: true }); const sig = d.map(x => x.id).join();
      if (d.length > LASTP) { toast(`${d.length} transaksi menunggu verifikasi`); beep(); if (navigator.vibrate) navigator.vibrate([80, 40, 80]); }
      LASTP = d.length; setBadge(d.length);
      if (PAGE === 'verif' && sig !== PL.map(x => x.id).join() && !LOCKED && !$('modal').classList.contains('on')) { PL = d; $('vl').innerHTML = verList(); }
    } else if (PAGE === 'baru') {
      if (W.t && W.t.status === 'Menunggu') {
        const t = await api('getTrxStatus', { id: W.t.id }, { silent: true, tries: 1, fresh: true });
        if (t.status !== 'Menunggu') { W.t = t; ROWS[t.id] = t; $('view').innerHTML = waitHtml(t); beep(); if (navigator.vibrate) navigator.vibrate(t.status === 'Disetujui' ? [100] : [100, 60, 100]); if (t.status === 'Disetujui' && SET.auto) struk(t); }
      } else if (HOME && !HOME.shift) { const h = await api('getHome', {}, { silent: true, tries: 1, fresh: true }); if (h.shift) { toast('Kas sudah dibuka, selamat bekerja'); route(); } }
    }
  } catch (e) {}
}, 5000);

/* ===== Penanganan error global & init ===== */
let ERRN = 0;
function report(m) { if (S.token && ERRN++ < 5) api('logError', { m: String(m) }, { silent: true, tries: 1 }).catch(() => {}); }
addEventListener('error', e => report(e.message)); addEventListener('unhandledrejection', e => { const r = e.reason; if (r && r.shown) return; report(r && r.message || r); });
addEventListener('offline', () => { $('offline').hidden = false; }); addEventListener('online', () => { $('offline').hidden = true; toast('Koneksi kembali'); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
['lu', 'lp'].forEach(i => $(i).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));
boot();
